<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kat‑Force — VIE Intelligence Engine</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-dark: #0d1117; --card-dark: #161b22; --border-gray: #30363d;
            --accent-blue: #58a6ff; --accent-red: #f85149; --accent-orange: #f0883e;
            --accent-purple: #bc8cff; --accent-green: #3fb950; --terminal-green: #238636;
        }
        body { background: var(--bg-dark); color: #c9d1d9; font-family: sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1300px; margin: 0 auto; }
        
        /* Debug Monitor Style */
        #debug-monitor {
            background: #000;
            border: 1px solid var(--border-gray);
            color: var(--accent-green);
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            max-height: 150px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,255,0,0.1);
        }
        .debug-line { margin-bottom: 2px; }
        .debug-timestamp { color: var(--text-muted); margin-right: 10px; }
        .debug-success { color: var(--accent-blue); }
        .debug-error { color: var(--accent-red); font-weight: bold; }

        /* Header & Filters */
        .header-nav { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; border-bottom: 1px solid var(--border-gray); padding-bottom: 20px; }
        .filter-group { display: flex; gap: 15px; background: var(--card-dark); padding: 15px; border-radius: 8px; border: 1px solid var(--border-gray); }
        select { background: #0d1117; color: var(--accent-blue); border: 1px solid var(--border-gray); padding: 8px; border-radius: 5px; font-weight: bold; outline: none; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card-dark); border: 1px solid var(--border-gray); padding: 20px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 800; display: block; }
        .stat-label { color: #8b949e; font-size: 0.75rem; text-transform: uppercase; }

        /* Table & Badges */
        .table-res { width: 100%; border-collapse: collapse; background: var(--card-dark); border: 1px solid var(--border-gray); border-radius: 8px; overflow: hidden; }
        th { background: #1f242c; padding: 12px; text-align: left; color: #8b949e; font-size: 0.8rem; }
        td { padding: 12px; border-bottom: 1px solid var(--border-gray); font-size: 0.85rem; vertical-align: top; }
        
        .badge { padding: 3px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; display: inline-block; margin: 2px; }
        .bg-red { background: rgba(248,81,73,0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .bg-purple { background: rgba(188,140,255,0.15); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
        .bg-orange { background: rgba(240,136,62,0.15); color: var(--accent-orange); border: 1px solid var(--accent-orange); }
        .bg-blue { background: rgba(88,166,255,0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        
        .ttp-box { background: #0d1117; padding: 5px; border-radius: 4px; border: 1px solid #30363d; margin-top: 5px; }
        .btn-heatmap { background: var(--terminal-green); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .btn-heatmap:hover { background: #2ea043; transform: scale(1.02); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <div>
            <h1 style="margin:0; color: var(--accent-blue);">🛡️ VIE Intelligence Engine</h1>
            <p style="margin:5px 0; font-size: 0.9rem; color: #8b949e;">Kat‑Force — Automotive Vulnerability Dashboard</p>
        </div>
        <div class="filter-group">
            <div>
                <label style="display:block; font-size:0.7rem; margin-bottom:5px;">CIBLE ECU</label>
                <select id="ecuSelect" onchange="renderDashboard()">
                    <option value="ALL">Tout le véhicule</option>
                    <option value="ECU1-TCU">ECU1 - Telematics</option>
                    <option value="ECU2-IVI">ECU2 - Infotainment</option>
                    <option value="ECU3-ADAS">ECU3 - ADAS</option>
                    <option value="ECU4-GW">ECU4 - Gateway</option>
                </select>
            </div>
            <div>
                <label style="display:block; font-size:0.7rem; margin-bottom:5px;">RÉFÉRENTIEL TTP</label>
                <select id="matrixSelect" onchange="renderDashboard()">
                    <option value="ics">MITRE ICS (Automotive)</option>
                    <option value="auto_isac">Auto-ISAC ATM</option>
                    <option value="embedded">MITRE Embedded</option>
                    <option value="mobile">MITRE Mobile</option>
                    <option value="enterprise">MITRE Enterprise</option>
                </select>
            </div>
        </div>
    </div>

    <div id="debug-monitor">
        <div class="debug-line">> Initialisation du module VIE Intelligence...</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><span id="stat-total" class="stat-value">-</span><span class="stat-label">CVE Total</span></div>
        <div class="stat-card" style="border-bottom: 3px solid var(--accent-red);"><span id="stat-crit" class="stat-value" style="color:var(--accent-red)">-</span><span class="stat-label">CVSS ≥ 7.0</span></div>
        <div class="stat-card" style="border-bottom: 3px solid var(--accent-purple);"><span id="stat-rce" class="stat-value" style="color:var(--accent-purple)">-</span><span class="stat-label">Exploits RCE</span></div>
        <div class="stat-card" style="border-bottom: 3px solid var(--accent-orange);"><span id="stat-kev" class="stat-value" style="color:var(--accent-orange)">-</span><span class="stat-label">CISA KEV</span></div>
    </div>

    <table class="table-res">
        <thead>
            <tr>
                <th>ECU</th>
                <th>CVE & DESCRIPTION</th>
                <th>SÉVÉRITÉ</th>
                <th>MAPPING MITRE / TTP</th>
                <th>RISK SCORE</th>
            </tr>
        </thead>
        <tbody id="vulnTableBody"></tbody>
    </table>

    <div style="text-align: right; margin-top: 20px; border-top: 1px solid var(--border-gray); padding-top: 20px;">
        <button class="btn-heatmap" onclick="generateHeatmap()">🔥 Générer Heatmap pour ATM VIEWER</button>
    </div>
</div>

<script>
    let vulnsData = [];
    let mitreMapping = {};
    let activeTechniques = new Set();

    // Fonction Debug Monitor
    function logDebug(message, type = 'info') {
        const monitor = document.getElementById('debug-monitor');
        const timestamp = new Date().toLocaleTimeString();
        let colorClass = '';
        if (type === 'success') colorClass = 'debug-success';
        if (type === 'error') colorClass = 'debug-error';

        monitor.innerHTML += `<div class="debug-line"><span class="debug-timestamp">[${timestamp}]</span> <span class="${colorClass}">${message}</span></div>`;
        monitor.scrollTop = monitor.scrollHeight;
    }

    async function init() {
        logDebug("Démarrage du chargement des ressources...");
        
        try {
            // Chargement du JSON des vulnérabilités
            logDebug("Tentative de lecture : data/results/detected_vulns.json");
            const vRes = await fetch('data/results/detected_vulns.json');
            if (!vRes.ok) throw new Error("Fichier detected_vulns.json introuvable (404)");
            vulnsData = await vRes.json();
            logDebug(`Succès : ${vulnsData.length} vulnérabilités chargées.`, 'success');

            // Chargement du mapping
            logDebug("Tentative de lecture : data/mapping_mitre.json");
            const mRes = await fetch('data/mapping_mitre.json');
            if (!mRes.ok) throw new Error("Fichier mapping_mitre.json introuvable (404)");
            mitreMapping = await mRes.json();
            logDebug(`Succès : ${Object.keys(mitreMapping).length} mappings CWE/TTP chargés.`, 'success');

            renderDashboard();
            logDebug("Dashboard rendu avec succès.", 'success');
        } catch (e) { 
            logDebug(`CRITICAL_ERROR : ${e.message}`, 'error');
            console.error("Erreur init:", e); 
        }
    }

    function calculateRisk(cvss, isKev, isRce) {
        let base = cvss * 6;
        if (isKev) base += 25;
        if (isRce) base += 15;
        return Math.min(100, Math.round(base));
    }

    function renderDashboard() {
        const ecuFilter = document.getElementById('ecuSelect').value;
        const matrixType = document.getElementById('matrixSelect').value;
        const tbody = document.getElementById('vulnTableBody');
        tbody.innerHTML = "";
        activeTechniques.clear();

        const filtered = ecuFilter === "ALL" ? vulnsData : vulnsData.filter(v => v.ecu === ecuFilter);
        let counters = { total: 0, crit: 0, rce: 0, kev: 0 };

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; color:var(--accent-orange)">Aucune donnée correspondant au filtre.</td></tr>`;
        }

        filtered.forEach(v => {
            counters.total++;
            const cvss = v.metrics ? (v.metrics.baseScore || 0) : 0;
            const isRce = v.description.toLowerCase().includes("remote code execution") || v.description.toLowerCase().includes("rce");
            const isKev = v.is_kev || false;
            const risk = calculateRisk(cvss, isKev, isRce);
            
            if (cvss >= 7) counters.crit++;
            if (isRce) counters.rce++;
            if (isKev) counters.kev++;

            let ttpHtml = `<span style="color:var(--text-muted)">N/A</span>`;
            if (v.cwe_ids && v.cwe_ids.length > 0) {
                const cweKey = v.cwe_ids[0];
                const mapEntry = mitreMapping[cweKey];
                if (mapEntry && mapEntry.mappings[matrixType]) {
                    const ttp = mapEntry.mappings[matrixType];
                    activeTechniques.add(ttp.id);
                    ttpHtml = `<div class="ttp-box">
                        <span class="badge bg-blue">${ttp.id}</span><br/>
                        <strong>${ttp.name}</strong><br/>
                        <small style="color:var(--text-muted)">${ttp.tactic}</small>
                    </div>`;
                } else {
                    ttpHtml = `<span class="badge" style="border:1px solid #30363d">${cweKey}</span>`;
                }
            }

            tbody.innerHTML += `
                <tr>
                    <td><span class="badge bg-blue">${v.ecu}</span></td>
                    <td>
                        <div style="font-weight:bold">${v.cve_id}</div>
                        <div style="font-size:0.75rem; color:#8b949e; max-width:400px;">${v.description.substring(0,100)}...</div>
                    </td>
                    <td><span class="badge ${cvss >= 7 ? 'bg-red' : 'bg-orange'}">${cvss}</span></td>
                    <td>${ttpHtml}</td>
                    <td><div style="font-size:1.2rem; font-weight:800; color:${risk > 70 ? 'var(--accent-red)' : 'white'}">${risk}<small>/100</small></div></td>
                </tr>`;
        });

        document.getElementById('stat-total').innerText = counters.total;
        document.getElementById('stat-crit').innerText = counters.crit;
        document.getElementById('stat-rce').innerText = counters.rce;
        document.getElementById('stat-kev').innerText = counters.kev;
    }

    function generateHeatmap() {
        const techArray = Array.from(activeTechniques);
        if (techArray.length === 0) {
            logDebug("Heatmap : Aucune technique à exporter.", "error");
            return;
        }
        localStorage.setItem('vie_heatmap_techniques', JSON.stringify(techArray));
        logDebug(`Heatmap : ${techArray.length} techniques exportées vers LocalStorage.`, "success");
        alert(`Heatmap prête ! ${techArray.length} techniques seront surlignées dans l'ATM Viewer.`);
    }

    window.onload = init;
</script>
</body>
</html>
