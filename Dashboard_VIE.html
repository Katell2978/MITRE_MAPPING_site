<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kat‑Force — Dynamic VIE Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-dark: #0d1117; --card-dark: #161b22; --border-gray: #30363d;
            --accent-blue: #58a6ff; --accent-red: #f85149; --accent-orange: #f0883e;
            --accent-purple: #bc8cff; --accent-green: #3fb950;
        }
        body { background: var(--bg-dark); color: #c9d1d9; font-family: -apple-system, system-ui, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Header & Filter */
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-gray); padding-bottom: 20px; }
        .filter-box { background: var(--card-dark); border: 1px solid var(--border-gray); padding: 10px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
        select { background: #0d1117; color: var(--accent-blue); border: 1px solid var(--border-gray); padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; outline: none; }
        
        #debug-monitor { background: #000; border: 1px solid var(--border-gray); color: var(--accent-green); font-family: monospace; font-size: 0.7rem; padding: 10px; margin-bottom: 20px; border-radius: 6px; max-height: 80px; overflow-y: auto; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card-dark); border: 1px solid var(--border-gray); padding: 20px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 2.2rem; font-weight: 800; display: block; color: #fff; }
        .stat-label { color: #8b949e; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }

        /* Tables */
        .summary-wrapper { background: var(--card-dark); border: 1px solid var(--border-gray); border-radius: 8px; margin-bottom: 40px; padding: 20px; }
        .summary-table, .table-res { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 0.75rem; color: #8b949e; padding: 12px; border-bottom: 2px solid var(--border-gray); text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: top; }

        .ecu-section { margin-bottom: 40px; background: var(--card-dark); border: 1px solid var(--border-gray); border-radius: 8px; overflow: hidden; }
        .ecu-header { background: #1c2128; padding: 15px 20px; border-bottom: 1px solid var(--border-gray); display: flex; justify-content: space-between; align-items: center; }
        
        .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.65rem; font-weight: bold; border: 1px solid transparent; display: inline-block; }
        .bg-red { background: rgba(248,81,73,0.15); color: var(--accent-red); border-color: var(--accent-red); }
        .bg-orange { background: rgba(240,136,62,0.15); color: var(--accent-orange); border-color: var(--accent-orange); }
        .bg-purple { background: rgba(188,140,255,0.15); color: var(--accent-purple); border-color: var(--accent-purple); }
        .bg-gray { background: rgba(110,118,129,0.15); color: #c9d1d9; border-color: #444c56; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
          <nav>
            <a href="index.html">🔍 Analyseur</a>
            <a href="veille.html">🔭 Veille (Watchtower)</a>
           <!-- <a href="CPEsearch.html">🔍Vuln by CPE</a>-->
            <a href="Dashboard_VIE.html">🔍Vuln Dashbaord</a>
          </nav>
        <div>
            <h1 style="color:var(--accent-blue); margin:0;">🛡️ VIE Dashboard</h1>
            <p id="fleet-desc" style="color:#8b949e; font-size: 0.9rem; margin:5px 0;">Analyse dynamique de l'inventaire...</p>
        </div>
        <div class="filter-box">
            <label style="font-size:0.75rem; font-weight:bold; color:#8b949e;">FILTRE UNITÉ :</label>
            <select id="ecuFilter" onchange="applyFilter()">
                <option value="ALL">Tout le véhicule</option>
            </select>
        </div>
    </div>

    <div id="debug-monitor">> Initialisation...</div>

    <div class="stats-grid">
        <div class="stat-card"><span id="total-cve" class="stat-value">0</span><span class="stat-label">CVE Détectées</span></div>
        <div class="stat-card" style="border-bottom: 3px solid var(--accent-red);"><span id="total-crit" class="stat-value" style="color:var(--accent-red)">0</span><span class="stat-label">Risques Critiques</span></div>
        <div class="stat-card"><span id="total-rce" class="stat-value" style="color:var(--accent-purple)">0</span><span class="stat-label">Vecteurs RCE</span></div>
        <div class="stat-card" style="border-bottom: 3px solid var(--accent-green);"><span id="avg-risk" class="stat-value">0</span><span class="stat-label">Score Risque Flotte</span></div>
    </div>

    <div class="summary-wrapper">
        <h3 style="margin-top:0; color:var(--accent-blue); font-size:1rem;">📊 Synthèse Executive</h3>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>UNITÉ</th>
                    <th>VULNÉRABILITÉS</th>
                    <th>SÉVÉRITÉ MAX</th>
                    <th>TOP CWE</th>
                    <th style="text-align:right;">RISK SCORE</th>
                </tr>
            </thead>
            <tbody id="summary-body"></tbody>
        </table>
    </div>

    <div id="ecu-details-container"></div>
</div>

<script>
    let inventory = [];
    let vulnsData = [];

    function cleanProductName(cpe) {
        if (!cpe) return "Produit Inconnu";
        const p = cpe.split(':');
        return p.length > 4 ? `${p[3].toUpperCase()} ${p[4].replace(/_/g, ' ')}` : cpe;
    }

    function log(msg, err=false) {
        const m = document.getElementById('debug-monitor');
        m.innerHTML += `<div style="color:${err?'#f85149':''}">> ${msg}</div>`;
        m.scrollTop = m.scrollHeight;
    }

    async function init() {
        try {
            // 1. Charger l'inventaire pour construire le filtre
            const invRes = await fetch('data/inventory/inventory_cpe.json');
            if (!invRes.ok) throw new Error("Inventaire introuvable.");
            inventory = await invRes.json();
            log(`Inventaire chargé : ${inventory.length} composants détectés.`);

            // 2. Charger les vulnérabilités
            const vulnRes = await fetch('data/results/detected_vulns.json');
            if (!vulnRes.ok) throw new Error("Résultats de scan introuvables.");
            vulnsData = await vulnRes.json();
            log(`Scan chargé : ${vulnsData.length} vulnérabilités.`);

            buildDynamicElements();
        } catch(e) { log(e.message, true); }
    }

    function calculateRisk(cvss, isKev, isRce) {
        let s = cvss * 6;
        if (isKev) s += 25;
        if (isRce) s += 15;
        return Math.min(100, Math.round(s));
    }

    function buildDynamicElements() {
        const filter = document.getElementById('ecuFilter');
        const summaryBody = document.getElementById('summary-body');
        const detailsContainer = document.getElementById('ecu-details-container');
        
        let gTotal = 0, gCrit = 0, gRce = 0, gRiskSum = 0;

        inventory.forEach(item => {
            const ecuId = item.component_id;
            const ecuName = item.description || "N/A";

            // Ajouter au filtre
            const opt = document.createElement('option');
            opt.value = ecuId;
            opt.textContent = `${ecuId} - ${ecuName}`;
            filter.appendChild(opt);

            // Analyser les vulnérabilités pour cet ECU
            const ev = vulnsData.filter(v => v.ecu === ecuId);
            let eMaxCvss = 0, eRiskSum = 0, eRceCount = 0, eCwes = new Set();
            let detailRows = "";

            ev.forEach(v => {
                const cvss = v.metrics?.baseScore || 0;
                const isRce = v.description.toLowerCase().includes("remote code") || v.description.toLowerCase().includes(" rce ");
                const risk = calculateRisk(cvss, v.is_kev, isRce);
                
                if (cvss > eMaxCvss) eMaxCvss = cvss;
                if (cvss >= 7) gCrit++;
                if (isRce) { eRceCount++; gRce++; }
                eRiskSum += risk;
                v.cwe_ids?.forEach(c => eCwes.add(c));

                detailRows += `
                    <tr>
                        <td><strong>${v.cve_id}</strong></td>
                        <td style="color:var(--accent-blue)">${cleanProductName(v.cpe)}</td>
                        <td>${v.description.substring(0,80)}... ${isRce?'<span class="badge bg-purple">RCE</span>':''}</td>
                        <td>${(v.cwe_ids||[]).map(c=>`<span class="badge bg-gray">${c}</span>`).join('')}</td>
                        <td><span class="badge ${cvss>=7?'bg-red':'bg-orange'}">${cvss.toFixed(1)}</span></td>
                        <td style="text-align:right; font-weight:bold;">${risk}</td>
                    </tr>`;
            });

            const eRiskAvg = ev.length ? Math.min(100, Math.round(eRiskSum / ev.length)) : 0;
            gRiskSum += eRiskAvg; gTotal += ev.length;

            // Ligne de synthèse
            summaryBody.innerHTML += `
                <tr class="summary-row" data-ecu="${ecuId}">
                    <td><strong style="color:var(--accent-blue)">${ecuId}</strong><br><small>${ecuName}</small></td>
                    <td>${ev.length} CVE ${eRceCount?`<span class="badge bg-purple">${eRceCount} RCE</span>`:''}</td>
                    <td><span class="badge ${eMaxCvss>=7?'bg-red':'bg-orange'}">${eMaxCvss.toFixed(1)}</span></td>
                    <td>${Array.from(eCwes).slice(0,3).map(c=>`<span class="badge bg-gray">${c}</span>`).join('')}</td>
                    <td style="text-align:right;"><span style="font-weight:800; color:${eRiskAvg>70?'var(--accent-red)':eRiskAvg>30?'var(--accent-orange)':'var(--accent-green)'}">${eRiskAvg}/100</span></td>
                </tr>`;

            // Bloc détail
            detailsContainer.innerHTML += `
                <div class="ecu-section" data-ecu="${ecuId}">
                    <div class="ecu-header">
                        <h2 style="margin:0; font-size:1.1rem; color:var(--accent-blue)">${ecuId} — Détails</h2>
                        <span class="badge bg-gray">RISK UNIT: ${eRiskAvg}/100</span>
                    </div>
                    <table class="table-res">
                        <thead><tr><th>CVE</th><th>PRODUIT</th><th>DESC</th><th>CWE</th><th>CVSS</th><th style="text-align:right;">RISK</th></tr></thead>
                        <tbody>${detailRows || '<tr><td colspan="6" style="text-align:center; padding:20px;">✅ Aucune vulnérabilité détectée.</td></tr>'}</tbody>
                    </table>
                </div>`;
        });

        document.getElementById('total-cve').innerText = gTotal;
        document.getElementById('total-crit').innerText = gCrit;
        document.getElementById('total-rce').innerText = gRce;
        document.getElementById('avg-risk').innerText = inventory.length ? Math.round(gRiskSum / inventory.length) : 0;
        document.getElementById('fleet-desc').innerText = `Analyse de ${inventory.length} composants actifs.`;
    }

    function applyFilter() {
        const val = document.getElementById('ecuFilter').value;
        document.querySelectorAll('.summary-row, .ecu-section').forEach(el => {
            if (val === "ALL" || el.getAttribute('data-ecu') === val) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        });
    }

    window.onload = init;
</script>
</body>
</html>
