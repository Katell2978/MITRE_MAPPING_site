<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIE Vuln Intel Engine : Dashboard Demonstarteur</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-dark: #0d1117; --card-dark: #161b22; --border-gray: #30363d;
            --accent-blue: #58a6ff; --accent-red: #f85149; --accent-orange: #f0883e;
            --accent-purple: #bc8cff; --accent-green: #3fb950;
        }
        body { background: var(--bg-dark); color: #c9d1d9; font-family: sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1300px; margin: 0 auto; }
        
        /* Debug Monitor Style */
        #debug-monitor { background: #000; border: 1px solid var(--border-gray); color: var(--accent-green); font-family: monospace; font-size: 0.75rem; padding: 10px; margin-bottom: 20px; border-radius: 5px; max-height: 100px; overflow-y: auto; }
        .debug-error { color: var(--accent-red); }
        .debug-success { color: var(--accent-blue); }

        /* Header */
        .header-nav { margin-bottom: 25px; border-bottom: 1px solid var(--border-gray); padding-bottom: 20px; text-align: center;}
        
        /* ECU Section & Risk Score */
        .ecu-section { margin-bottom: 40px; background: var(--card-dark); border: 1px solid var(--border-gray); border-radius: 8px; overflow: hidden; }
        .ecu-header { background: #1f242c; padding: 15px 20px; border-bottom: 1px solid var(--border-gray); display: flex; justify-content: space-between; align-items: center; }
        .ecu-title { margin: 0; color: var(--accent-blue); font-size: 1.2rem; }
        
        .ecu-risk-summary { padding: 15px 20px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--border-gray); display: flex; justify-content: space-between; align-items: center;}
        .risk-value { font-size: 2rem; font-weight: 800; }
        .risk-label { color: #8b949e; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;}

        /* Table & Badges */
        .table-res { width: 100%; border-collapse: collapse; font-size: 0.85rem;}
        th { background: rgba(255,255,255,0.02); padding: 12px; text-align: left; color: #8b949e; font-size: 0.75rem; text-transform: uppercase;}
        td { padding: 12px; border-bottom: 1px solid var(--border-gray); vertical-align: top; }
        
        .badge { padding: 3px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; display: inline-block; margin: 2px; border: 1px solid transparent;}
        .bg-red { background: rgba(248,81,73,0.15); color: var(--accent-red); border-color: var(--accent-red); }
        .bg-purple { background: rgba(188,140,255,0.15); color: var(--accent-purple); border-color: var(--accent-purple); }
        .bg-orange { background: rgba(240,136,62,0.15); color: var(--accent-orange); border-color: var(--accent-orange); }
        .bg-gray { background: rgba(110,118,129,0.15); color: #8b949e; border-color: #30363d; }
        
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <h1 style="margin:0; color: var(--accent-blue);">🛡️ VIE Risk Dashboard</h1>
        <p style="margin:5px 0; font-size: 0.9rem; color: #8b949e;">Demonstrateur avec fake data CPE — Automotive Unit Risk Analysis</p>
    </div>

    <div id="debug-monitor">
        <div>> Initialisation du Risk Engine...</div>
    </div>

    <div id="ecuTablesContainer">
        <div style="text-align:center; padding:50px; color:var(--text-muted)">Chargement des données...</div>
    </div>

</div>

<script>
    // Liste des ECU à surveiller (doit correspondre aux IDs dans ton inventaire)
    const monitoredECUs = [
        { id: "ECU1-TCU", name: "Telematics Control Unit" },
        { id: "ECU2-IVI", name: "Infotainment System" },
        { id: "ECU3-ADAS", name: "Advanced Driver Assistance" },
        { id: "ECU4-GW", name: "Central Gateway" }
    ];

    let vulnsData = [];

    // Fonction Debug Monitor
    function logDebug(message, type = 'info') {
        const monitor = document.getElementById('debug-monitor');
        let colorClass = '';
        if (type === 'success') colorClass = 'debug-success';
        if (type === 'error') colorClass = 'debug-error';
        monitor.innerHTML += `<div class="${colorClass}">> ${message}</div>`;
        monitor.scrollTop = monitor.scrollHeight;
    }

    async function init() {
        try {
            logDebug("Tentative de lecture : data/results/detected_vulns.json");
            const vRes = await fetch('data/results/detected_vulns.json');
            if (!vRes.ok) throw new Error("Fichier detected_vulns.json introuvable (404)");
            vulnsData = await vRes.json();
            logDebug(`Succès : ${vulnsData.length} vulnérabilités chargées.`, 'success');

            renderECUDashboard();
        } catch (e) { 
            logDebug(`ERREUR : ${e.message}`, 'error');
            document.getElementById('ecuTablesContainer').innerHTML = `<div style="text-align:center; padding:50px; color:var(--accent-red)">Erreur de chargement des données. Vérifiez le Debug Monitor.</div>`;
        }
    }

    // Formule de Risque VIE simplifiée
    function calculateRisk(cvss, isKev, isRce) {
        let base = cvss * 6; // Score sur 60
        if (isKev) base += 25; // Bonus Critique KEV
        if (isRce) base += 15; // Bonus Critique RCE
        return Math.min(100, Math.round(base)); // Cap à 100
    }

    function renderECUDashboard() {
        const container = document.getElementById('ecuTablesContainer');
        container.innerHTML = ""; // Vide le chargeur

        monitoredECUs.forEach(ecu => {
            // 1. Filtrer les vulnérabilités pour cet ECU
            const ecuVulns = vulnsData.filter(v => v.ecu === ecu.id);
            
            let tableRows = "";
            let totalRiskScore = 0;
            let vulnCount = ecuVulns.length;

            if (vulnCount === 0) {
                tableRows = `<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--accent-green)">Aucune vulnérabilité détectée. ✅</td></tr>`;
            } else {
                ecuVulns.forEach(v => {
                    const cvss = v.metrics ? (v.metrics.baseScore || 0) : 0;
                    const desc = v.description.toLowerCase();
                    const isRce = desc.includes("remote code execution") || desc.includes(" rce ");
                    const isKev = v.is_kev || false;
                    
                    // Calcul du risque pour CETTE vulnérabilité
                    const risk = calculateRisk(cvss, isKev, isRce);
                    totalRiskScore += risk; // Accumulation pour le score de l'ECU

                    // Affichage des CWE
                    let cweBadges = "";
                    if (v.cwe_ids && v.cwe_ids.length > 0) {
                        v.cwe_ids.forEach(cwe => {
                            cweBadges += `<span class="badge bg-gray">${cwe}</span>`;
                        });
                    } else {
                        cweBadges = `<span class="badge bg-gray">N/A</span>`;
                    }

                    tableRows += `
                        <tr>
                            <td style="width:120px; font-weight:bold;">${v.cve_id}</td>
                            <td>
                                <div style="color:#8b949e; max-width:500px; margin-bottom:5px;">${v.description.substring(0,120)}...</div>
                                ${isRce ? '<span class="badge bg-purple">RCE</span>' : ''}
                                ${isKev ? '<span class="badge bg-red">CISA KEV</span>' : ''}
                            </td>
                            <td style="width:150px;">${cweBadges}</td>
                            <td style="width:100px; text-align:center;">
                                <span class="badge ${cvss >= 7 ? 'bg-red' : 'bg-orange'}">${cvss.toFixed(1)}</span>
                            </td>
                        </tr>
                    `;
                });
            }

            // Calcul du Score de Risque Moyen de l'ECU (Capé à 100)
            const averageRisk = vulnCount > 0 ? Math.min(100, Math.round(totalRiskScore / vulnCount)) : 0;
            
            // Définition de la couleur du score
            let riskColor = 'var(--accent-green)';
            if (averageRisk > 30) riskColor = 'var(--accent-orange)';
            if (averageRisk > 70) riskColor = 'var(--accent-red)';

            // 2. Création de la section HTML pour cet ECU
            const ecuSectionHTML = `
                <div class="ecu-section">
                    <div class="ecu-header">
                        <h2 class="ecu-title">${ecu.id} <span style="font-size:0.8rem; color:#8b949e; font-weight:normal;">(${ecu.name})</span></h2>
                        <span class="badge bg-gray">${vulnCount} CVE</span>
                    </div>
                    
                    <table class="table-res">
                        <thead>
                            <tr>
                                <th>IDENTIFIANT</th>
                                <th>DESCRIPTION & FLAGS</th>
                                <th>FAIBLESSES (CWE)</th>
                                <th style="text-align:center;">CVSS Base</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>

                    <div class="ecu-risk-summary">
                        <div class="risk-label">SCORE DE RISQUE GLOBAL DE L'UNITÉ</div>
                        <div class="risk-value" style="color:${riskColor}">${averageRisk}<small style="font-size:1rem; color:#8b949e;">/100</small></div>
                    </div>
                </div>
            `;

            container.innerHTML += ecuSectionHTML;
        });

        logDebug("Tableaux des ECUs rendus.", 'success');
    }

    window.onload = init;
</script>
</body>
</html>
