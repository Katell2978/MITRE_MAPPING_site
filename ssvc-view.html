<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SSVC – Decision Tree Viewer</title>
<!-- Page pour afficher les arbre de décision au format json -->
<!-- D3 v3 OBLIGATOIRE pour simple.js -->
<script src="https://d3js.org/d3.v3.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: #e7eaf3;
}
header {
  padding: 12px 16px;
  background: #111834;
  border-bottom: 1px solid #22305c;
}
main {
  display: flex;
  height: calc(100vh - 50px);
}
aside {
  width: 380px;
  background: #0f1730;
  border-right: 1px solid #22305c;
  padding: 12px;
  overflow: auto;
}
#graph {
  flex: 1;
  overflow: auto;
  background: #0b1020;
}
select, button {
  width: 100%;
  margin-top: 8px;
  padding: 6px;
  background: #12204a;
  color: white;
  border: 1px solid #2a3a6b;
}
button { cursor: pointer; }
.error {
  margin-top: 10px;
  padding: 8px;
  border-left: 4px solid #dc3545;
  background: #2a0f18;
  color: #ffb3b3;
  font-size: 13px;
}
.ok {
  border-left-color: #28a745;
  background: #0f2a18;
  color: #b7f5c6;
}
pre {
  white-space: pre-wrap;
  font-size: 12px;
}
</style>
</head>

<body>
<header>
  <b>SSVC – Decision Tree Viewer</b>
</header>

<main>
  <aside>
    <h3>Decision Trees</h3>

    <label>SSVC JSON disponible</label>
    <select id="jsonSelect"></select>

    <button onclick="loadSelected()">Charger le graphe</button>

    <div id="status"></div>
  </aside>

  <div id="graph"></div>
</main>

<!-- moteur SSVC -->
<script src="scripts/simple.js"></script>

<script>
const STATUS = document.getElementById("status");
const SELECT = document.getElementById("jsonSelect");

/* ---------- helpers UI ---------- */

function showError(msg, details) {
  STATUS.innerHTML = `
    <div class="error">
      <b>Erreur</b><br>${msg}
      ${details ? `<pre>${details}</pre>` : ""}
    </div>`;
}

function showOk(msg) {
  STATUS.innerHTML = `<div class="error ok">${msg}</div>`;
}

/* ---------- validation SSVC ---------- */

function validateSSVC(json) {
  const errors = [];

  if (!json.decision_points || typeof json.decision_points !== "object") {
    errors.push("champ manquant ou invalide : decision_points");
  }

  if (!json.mapping || !Array.isArray(json.mapping)) {
    errors.push("champ manquant ou invalide : mapping (array requis)");
  }

  if (!json.outcome) {
    errors.push("champ manquant : outcome");
  }

  if (json.outcome && !json.decision_points[json.outcome]) {
    errors.push(`outcome "${json.outcome}" absent de decision_points`);
  }

  if (json.mapping && json.mapping.length > 0) {
    const sample = json.mapping[0];
    Object.keys(json.decision_points).forEach(dp => {
      if (!(dp in sample)) {
        errors.push(`mapping incomplet : clé "${dp}" absente`);
      }
    });
  }

  return errors;
}

/* ---------- chargement liste ---------- */

fetch("ssvc/index.json")
  .then(r => {
    if (!r.ok) throw new Error("Impossible de charger ssvc/index.json");
    return r.json();
  })
  .then(index => {
    if (!index.files || !Array.isArray(index.files)) {
      throw new Error("Format invalide de ssvc/index.json");
    }
    index.files.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f;
      opt.textContent = f;
      SELECT.appendChild(opt);
    });
    showOk("Liste des arbres chargée");
  })
  .catch(e => showError(e.message));

/* ---------- chargement graphe ---------- */

function loadSelected() {
  const file = SELECT.value;
  if (!file) return;

  STATUS.innerHTML = "";
  document.getElementById("graph").innerHTML = "";

  fetch(`ssvc/${file}`)
    .then(r => {
      if (!r.ok) throw new Error(`Impossible de charger ${file}`);
      return r.json();
    })
    .then(json => {
      const errors = validateSSVC(json);
      if (errors.length) {
        showError("JSON SSVC invalide", errors.join("\n"));
        return;
      }

      graphModule.setSelector("#graph");
      graphModule.dt_graph(json);

      showOk(`Graphe chargé : ${file}`);
    })
    .catch(e => showError(e.message));
}
</script>
</body>
</html>
