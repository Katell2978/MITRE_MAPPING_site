<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OOAC — VIE Master Dashboard for ECU</title>
    <style>
        :root {
            --bg-dark: #0d1117; --card-dark: #161b22; --border-gray: #30363d;
            --accent-blue: #58a6ff; --accent-red: #f85149; --accent-orange: #f0883e;
            --accent-purple: #bc8cff;
        }
        body { background: var(--bg-dark); color: #c9d1d9; font-family: -apple-system, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1600px; margin: 0 auto; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-gray); padding-bottom: 20px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card-dark); border: 1px solid var(--border-gray); padding: 20px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 800; display: block; color: #fff; }

        .summary-wrapper, .ecu-section { background: var(--card-dark); border: 1px solid var(--border-gray); border-radius: 8px; margin-bottom: 30px; padding: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 1000px; }
        th { text-align: left; font-size: 0.75rem; color: #8b949e; text-transform: uppercase; padding: 12px; border-bottom: 2px solid var(--border-gray); }
        td { padding: 12px; border-bottom: 1px solid #30363d; vertical-align: middle; font-size: 0.85rem; word-wrap: break-word; }

        .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; display: inline-block; border: 1px solid transparent; }
        .bg-red { background: rgba(248,81,73,0.15); color: var(--accent-red); border-color: var(--accent-red); }
        .bg-orange { background: rgba(240,136,62,0.15); color: var(--accent-orange); border-color: var(--accent-orange); }
        .bg-purple { background: rgba(188,140,255,0.15); color: var(--accent-purple); border-color: var(--accent-purple); }
        .bg-gray { background: rgba(110,118,129,0.15); color: #8b949e; border-color: #30363d; }
        
        /* Attack Path Style */
        .path-visual { font-family: monospace; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 6px; width: fit-content; border: 1px solid #30363d; }
        .path-arrow { color: var(--accent-blue); font-weight: bold; }

        .vector-font { font-family: 'Courier New', monospace; font-size: 0.75rem; color: #8b949e; line-height: 1.4; }
        .hidden { display: none !important; }
        .muted { color: #8b949e; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h1 style="color:var(--accent-blue); margin:0;">Vuln Intel Engine - Analysis based on ECU referenced (Fake Data)</h1>
        <select id="ecuFilter" onchange="applyFilter()" style="background:#0d1117; color:var(--accent-blue); padding:8px 15px; border:1px solid var(--border-gray); border-radius:6px; font-weight:bold;">
            <option value="ALL">Vue Flotte Complète</option>
        </select>
    </div>

    <div class="stats-grid">
        <div class="stat-card"> <span id="total-cve" class="stat-value">0</span> <span class="muted">CVE Détectées</span> </div>
        <div class="stat-card"> <span id="total-crit" class="stat-value" style="color:var(--accent-red)">0</span> <span class="muted">Critiques (>=7)</span> </div>
        <div class="stat-card"> <span id="total-rce" class="stat-value" style="color:var(--accent-purple)">0</span> <span class="muted">Vecteurs RCE</span> </div>
        <div class="stat-card"> <span id="avg-risk" class="stat-value">0</span> <span class="muted">Risque Moyen /100</span> </div>
    </div>

    <div class="summary-wrapper">
        <h3 style="margin-top:0; color:var(--accent-blue)">📊 Synthèse par Unité (ECU)</h3>
        <table style="table-layout: auto;">
            <thead>
                <tr>
                    <th>UNITÉ</th>
                    <th>VOLUMES</th>
                    <th>SÉVÉRITÉ (B/T)</th>
                    <th>TOP CWE</th>
                    <th>ATTACK PATH</th>
                    <th style="text-align:right">VIE RISK SCORE</th>
                </tr>
            </thead>
            <tbody id="summary-body"></tbody>
        </table>
    </div>

    <div id="ecu-details-container"></div>
</div>

<script>
    let inventory = [];
    let vulnsData = [];

    // Récupération sécurisée du CWE depuis le tableau cwe_ids
    function getCWE(v) {
        if (v.cwe_ids && v.cwe_ids.length > 0) return v.cwe_ids[0];
        return v.cwe || "N/A";
    }

    // Calcul Attack Path Dynamique
    function getAttackPath(ecu, ev, hasRce, maxB) {
        if (!ev.length) return `<span class="badge bg-gray">Aucun Risque</span>`;
        // Entrée : Internet si exposé, sinon physique
        const entry = (ecu.is_exposed !== false) ? "🌐 (Net)" : "🔌 (Phys)";
        // Exploitation : RCE ou High Score
        const exploit = hasRce ? "🔓 RCE" : (maxB >= 7 ? "💥 Exploit" : "⚠️ Limit");
        // Impact : Selon Safety Impact de l'ECU
        const impact = (ecu.safety_impact === "High") ? "☢️ CRIT" : "🚩 WARN";
        
        return `
            <div class="path-visual">
                <span>${entry}</span><span class="path-arrow">→</span>
                <span>${exploit}</span><span class="path-arrow">→</span>
                <span>${impact}</span>
            </div>`;
    }

    async function init() {
        try {
            const invRes = await fetch('data/inventory/inventory_cpe.json');
            inventory = await invRes.json();
            const vulnRes = await fetch('data/results/detected_vulns.json');
            vulnsData = await vulnRes.json();
            render();
        } catch(e) { console.error("Erreur d'initialisation", e); }
    }

    function render() {
        const summaryBody = document.getElementById('summary-body');
        const detailsContainer = document.getElementById('ecu-details-container');
        let gTotal = 0, gCrit = 0, gRce = 0, gRiskSum = 0;

        inventory.forEach(ecu => {
            const ev = vulnsData.filter(v => v.ecu === ecu.component_id);
            if (ev.length === 0) return;

            let maxB = 0, hasRce = false;
            const cweCounts = {};

            ev.forEach(v => {
                let s = v.metrics?.baseScore || 0;
                if (s > maxB) maxB = s;
                if (s >= 7) gCrit++;
                if (v.is_rce || v.description?.toLowerCase().includes("remote code")) hasRce = true;
                
                let c = getCWE(v);
                cweCounts[c] = (cweCounts[c] || 0) + 1;
            });

            if (hasRce) gRce++;
            const topCWE = Object.entries(cweCounts).sort((a,b)=>b[1]-a[1])[0][0];
            const risk = Math.min(100, Math.round(maxB * 8 + (Math.log10(ev.length + 1) * 5) + (hasRce ? 10 : 0)));
            gTotal += ev.length; gRiskSum += risk;

            // Rendu de la ligne de synthèse
            summaryBody.innerHTML += `
                <tr class="summary-row" data-ecu="${ecu.component_id}">
                    <td><b style="color:var(--accent-blue)">${ecu.component_id}</b></td>
                    <td>${ev.length} CVE ${hasRce ? '<span class="badge bg-purple" style="margin-left:5px">RCE</span>' : ''}</td>
                    <td><span class="badge ${maxB>=7?'bg-red':'bg-orange'}">${maxB.toFixed(1)}</span> <span class="muted">/ ${(maxB*0.95).toFixed(1)}</span></td>
                    <td><span class="badge bg-gray">${topCWE}</span></td>
                    <td>${getAttackPath(ecu, ev, hasRce, maxB)}</td>
                    <td style="text-align:right; font-weight:bold; font-size:1rem; color:${risk > 70 ? 'var(--accent-red)' : 'white'}">${risk}/100</td>
                </tr>`;

            // Rendu des détails techniques
            let rows = ev.map(v => {
                const bScore = v.metrics?.baseScore || 0;
                const bVec = v.metrics?.vectorString || "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H";
                const tScore = (bScore * 0.95).toFixed(1);
                const cwe = getCWE(v);

                return `
                <tr>
                    <td style="width:15%"><b>${v.cve_id}</b><br><span class="badge bg-gray" style="margin-top:5px">${cwe}</span></td>
                    <td style="width:65%">
                        <div class="vector-font"><b style="color:var(--accent-blue)">BASE:</b> ${bVec}</div>
                        <div class="vector-font" style="margin-top:4px"><b style="color:var(--accent-orange)">TEMP:</b> ${bVec}/E:P/RL:O/RC:C</div>
                    </td>
                    <td style="width:20%; text-align:right;">
                        <span class="badge ${bScore >= 7 ? 'bg-red' : 'bg-gray'}">${bScore.toFixed(1)}</span>
                        <div class="muted" style="font-size:0.7rem; margin-top:4px;">Temp: ${tScore}</div>
                    </td>
                </tr>`;
            }).join('');

            detailsContainer.innerHTML += `
                <div class="ecu-section" data-ecu="${ecu.component_id}">
                    <h4 style="margin:0 0 15px 0; padding-bottom:10px; border-bottom:1px solid #30363d; color:var(--accent-blue)">
                        ${ecu.component_id} — ${ecu.description}
                    </h4>
                    <table>
                        <thead><tr><th>CVE / CWE</th><th>VECTEURS CVSS TECHNIQUES</th><th style="text-align:right">SCORES (B/T)</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
            
            const opt = document.createElement('option');
            opt.value = ecu.component_id; opt.textContent = ecu.component_id;
            document.getElementById('ecuFilter').appendChild(opt);
        });

        document.getElementById('total-cve').innerText = gTotal;
        document.getElementById('total-crit').innerText = gCrit;
        document.getElementById('total-rce').innerText = gRce;
        document.getElementById('avg-risk').innerText = Math.round(gRiskSum / inventory.length);
    }

    function applyFilter() {
        const val = document.getElementById('ecuFilter').value;
        document.querySelectorAll('.summary-row, .ecu-section').forEach(el => {
            if (val === "ALL" || el.getAttribute('data-ecu') === val) el.classList.remove('hidden');
            else el.classList.add('hidden');
        });
    }
    window.onload = init;
</script>
</body>
</html>
