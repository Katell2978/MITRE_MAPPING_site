<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OOAC — VIE Master Dashboard (Fix CWE_IDS)</title>
    <style>
        :root {
            --bg-dark: #0d1117; --card-dark: #161b22; --border-gray: #30363d;
            --accent-blue: #58a6ff; --accent-red: #f85149; --accent-orange: #f0883e;
            --accent-purple: #bc8cff;
        }
        body { background: var(--bg-dark); color: #c9d1d9; font-family: -apple-system, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1600px; margin: 0 auto; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-gray); padding-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card-dark); border: 1px solid var(--border-gray); padding: 20px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 800; display: block; }

        .summary-wrapper, .ecu-section { background: var(--card-dark); border: 1px solid var(--border-gray); border-radius: 8px; margin-bottom: 30px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { text-align: left; font-size: 0.75rem; color: #8b949e; text-transform: uppercase; padding: 10px; border-bottom: 2px solid var(--border-gray); }
        td { padding: 12px 10px; border-bottom: 1px solid #30363d; vertical-align: middle; font-size: 0.85rem; word-wrap: break-word; }

        .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; display: inline-block; }
        .bg-red { background: rgba(248,81,73,0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .bg-gray { background: rgba(110,118,129,0.2); color: #8b949e; border: 1px solid #30363d; }
        
        .vector-font { font-family: monospace; font-size: 0.75rem; color: #8b949e; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h1 style="color:var(--accent-blue);">🛡️ VIE Master Dashboard</h1>
        <select id="ecuFilter" onchange="applyFilter()" style="background:#0d1117; color:white; padding:8px; border-radius:5px;">
            <option value="ALL">Vue Globale</option>
        </select>
    </div>

    <div class="stats-grid">
        <div class="stat-card"> <span id="total-cve" class="stat-value">0</span> <span>CVE Total</span> </div>
        <div class="stat-card"> <span id="total-crit" class="stat-value" style="color:var(--accent-red)">0</span> <span>Critiques</span> </div>
        <div class="stat-card"> <span id="total-rce" class="stat-value" style="color:var(--accent-purple)">0</span> <span>RCE</span> </div>
        <div class="stat-card"> <span id="avg-risk" class="stat-value">0</span> <span>Score Risque</span> </div>
    </div>

    <div class="summary-wrapper">
        <h3>📊 Synthèse par Unité (ECU)</h3>
        <table>
            <thead>
                <tr>
                    <th style="width:15%">UNITÉ</th>
                    <th style="width:15%">VOLUMES</th>
                    <th style="width:20%">CVSS (Base / Temp)</th>
                    <th style="width:15%">TOP CWE</th>
                    <th style="width:20%">ATTACK PATH</th>
                    <th style="width:15%; text-align:right;">RISK SCORE</th>
                </tr>
            </thead>
            <tbody id="summary-body"></tbody>
        </table>
    </div>

    <div id="ecu-details-container"></div>
</div>

<script>
    let inventory = [];
    let vulnsData = [];

    // ✅ SOLUTION : Accès au tableau cwe_ids détecté dans votre JSON
    function getCWEValue(v) {
        if (v.cwe_ids && Array.isArray(v.cwe_ids) && v.cwe_ids.length > 0) {
            return v.cwe_ids[0]; // Prend le premier CWE de la liste
        }
        return v.cwe || v.cwe_id || "N/A";
    }

    async function init() {
        try {
            const invRes = await fetch('data/inventory/inventory_cpe.json');
            inventory = await invRes.json();
            const vulnRes = await fetch('data/results/detected_vulns.json');
            vulnsData = await vulnRes.json();
            render();
        } catch(e) { console.error("Erreur chargement JSON:", e); }
    }

    function render() {
        const summaryBody = document.getElementById('summary-body');
        const detailsContainer = document.getElementById('ecu-details-container');
        let gTotal = 0, gCrit = 0, gRiskSum = 0;

        inventory.forEach(ecu => {
            const ev = vulnsData.filter(v => v.ecu === ecu.component_id);
            if (ev.length === 0) return;

            let maxB = 0;
            const cweCounts = {};

            ev.forEach(v => {
                let s = v.metrics?.baseScore || 0;
                if (s > maxB) maxB = s;
                if (s >= 7) gCrit++;
                
                let c = getCWEValue(v);
                cweCounts[c] = (cweCounts[c] || 0) + 1;
            });

            const topCWE = Object.entries(cweCounts).sort((a,b)=>b[1]-a[1])[0][0];
            const risk = Math.min(100, Math.round(maxB * 8 + (Math.log10(ev.length + 1) * 5)));
            gTotal += ev.length; gRiskSum += risk;

            summaryBody.innerHTML += `
                <tr class="summary-row" data-ecu="${ecu.component_id}">
                    <td><b>${ecu.component_id}</b></td>
                    <td>${ev.length} CVE</td>
                    <td><span class="badge bg-red">${maxB.toFixed(1)}</span> <span style="color:#8b949e">/ ${(maxB*0.95).toFixed(1)}</span></td>
                    <td><span class="badge bg-gray">${topCWE}</span></td>
                    <td>🌐 → 🔓 → 🚩</td>
                    <td style="text-align:right; font-weight:bold; color:${risk > 70 ? 'var(--accent-red)' : 'white'}">${risk}/100</td>
                </tr>`;

            let rows = ev.map(v => {
                const bScore = v.metrics?.baseScore || 0;
                const bVec = v.metrics?.vectorString || "N/A";
                const cwe = getCWEValue(v);

                return `
                <tr>
                    <td style="width:15%"><b>${v.cve_id}</b><br><span class="badge bg-gray" style="margin-top:5px">${cwe}</span></td>
                    <td style="width:65%">
                        <div class="vector-font"><b style="color:var(--accent-blue)">BASE:</b> ${bVec}</div>
                        <div class="vector-font" style="margin-top:4px"><b style="color:var(--accent-orange)">TEMP:</b> ${bVec}/E:P/RL:O/RC:C</div>
                    </td>
                    <td style="width:20%; text-align:right;">
                        <span class="badge ${bScore >= 7 ? 'bg-red' : 'bg-gray'}">${bScore.toFixed(1)}</span>
                        <div style="font-size:0.7rem; color:#8b949e; margin-top:4px;">Temp: ${(bScore*0.95).toFixed(1)}</div>
                    </td>
                </tr>`;
            }).join('');

            detailsContainer.innerHTML += `
                <div class="ecu-section" data-ecu="${ecu.component_id}">
                    <h4 style="border-left:3px solid var(--accent-blue); padding-left:10px;">${ecu.component_id} — Détail des vecteurs</h4>
                    <table>
                        <thead><tr><th>CVE / CWE</th><th>VECTEURS CVSS</th><th style="text-align:right">SCORES</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
            
            const opt = document.createElement('option');
            opt.value = ecu.component_id; opt.textContent = ecu.component_id;
            document.getElementById('ecuFilter').appendChild(opt);
        });

        document.getElementById('total-cve').innerText = gTotal;
        document.getElementById('total-crit').innerText = gCrit;
        document.getElementById('avg-risk').innerText = Math.round(gRiskSum / inventory.length);
    }

    function applyFilter() {
        const val = document.getElementById('ecuFilter').value;
        document.querySelectorAll('.summary-row, .ecu-section').forEach(el => {
            if (val === "ALL" || el.getAttribute('data-ecu') === val) el.classList.remove('hidden');
            else el.classList.add('hidden');
        });
    }
    window.onload = init;
</script>
</body>
</html>
