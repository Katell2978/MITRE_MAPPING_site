<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OOAC — VIE Master Dashboard (SSVC & Export PDF)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0d1117; --card-dark: #161b22; --border-gray: #30363d;
            --accent-blue: #58a6ff; --accent-red: #f85149; --accent-orange: #f0883e;
            --accent-purple: #bc8cff;
        }
        body { background: var(--bg-dark); color: #c9d1d9; font-family: sans-serif; padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; }
        
        /* Contrôles */
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-gray); padding-bottom: 20px; }
        .controls { display: flex; gap: 10px; align-items: center; }
        select, button { background: #21262d; color: white; border: 1px solid var(--border-gray); padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        button:hover { background: var(--accent-blue); }

        /* Tableaux */
        .ecu-section { background: var(--card-dark); border: 1px solid var(--border-gray); border-radius: 8px; margin-bottom: 30px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { text-align: left; font-size: 0.75rem; color: #8b949e; text-transform: uppercase; padding: 12px; border-bottom: 2px solid var(--border-gray); }
        td { padding: 12px; border-bottom: 1px solid #30363d; vertical-align: middle; font-size: 0.85rem; }

        /* Badges */
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; display: inline-block; }
        .bg-red { background: rgba(248,81,73,0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .bg-orange { background: rgba(240,136,62,0.2); color: var(--accent-orange); border: 1px solid var(--accent-orange); }
        .bg-blue { background: rgba(88,166,255,0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue); }

        /* SSVC Case à cocher */
        .decision-box { display: flex; align-items: center; gap: 8px; }
        input[type="checkbox"] { transform: scale(1.2); }
        
        .vector-font { font-family: monospace; font-size: 0.75rem; color: #8b949e; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container" id="report-content">
    <div class="header-flex">
        <h1 style="color:var(--accent-blue);">🛡️ VIE Master Dashboard : Décisions SSVC</h1>
        <div class="controls">
            <select id="ecuFilter" onchange="applyFilter()"><option value="ALL">Toutes les ECU</option></select>
            <select id="sortOrder" onchange="render()"><option value="score">Trier par Score</option><option value="id">Trier par ID</option></select>
            <button onclick="exportPDF()">📥 Exporter Rapport PDF</button>
        </div>
    </div>

    <div class="ecu-section" style="border-left: 4px solid var(--accent-purple);">
        <h3 style="margin-top:0">⚖️ Référentiel SSVC (Stakeholder-Specific Vulnerability Categorization)</h3>
        <p style="font-size: 0.8rem; opacity: 0.8;">La proposition automatique est basée sur le croisement de l'Exploitabilité (Base CVSS) et de l'Impact Sécurité (Config ECU).</p>
    </div>

    <div id="ecu-details-container"></div>
</div>

<script>
    let inventory = [];
    let vulnsData = [];

    // Logique de décision SSVC
    function getSSVCDecision(score, ecu) {
        const isSafetyHigh = ecu.safety_impact === "High";
        if (score >= 9 && isSafetyHigh) return { label: "IMMEDIATE", class: "bg-red" };
        if (score >= 7 || isSafetyHigh) return { label: "SCHEDULED", class: "bg-orange" };
        return { label: "TRACK", class: "bg-blue" };
    }

    async function init() {
        try {
            const invRes = await fetch('data/inventory/inventory_cpe.json');
            inventory = await invRes.json();
            const vulnRes = await fetch('data/results/detected_vulns.json');
            vulnsData = await vulnRes.json();
            
            // Remplir le filtre
            inventory.forEach(e => {
                const opt = document.createElement('option');
                opt.value = e.component_id; opt.textContent = e.component_id;
                document.getElementById('ecuFilter').appendChild(opt);
            });
            
            render();
        } catch(e) { console.error("Erreur chargement", e); }
    }

    function render() {
        const container = document.getElementById('ecu-details-container');
        const sortVal = document.getElementById('sortOrder').value;
        container.innerHTML = "";

        inventory.forEach(ecu => {
            let ev = vulnsData.filter(v => v.ecu === ecu.component_id);
            if (ev.length === 0) return;

            // Tri
            if (sortVal === "score") ev.sort((a,b) => (b.metrics?.baseScore||0) - (a.metrics?.baseScore||0));
            else ev.sort((a,b) => a.cve_id.localeCompare(b.cve_id));

            let rows = ev.map(v => {
                const bScore = v.metrics?.baseScore || 0;
                const ssvc = getSSVCDecision(bScore, ecu);
                const cwe = (v.cwe_ids && v.cwe_ids.length > 0) ? v.cwe_ids[0] : "N/A";

                return `
                <tr>
                    <td style="width:15%"><b>${v.cve_id}</b><br><span class="badge bg-gray" style="margin-top:5px">${cwe}</span></td>
                    <td style="width:50%">
                        <div class="vector-font"><b>BASE:</b> ${v.metrics?.vectorString || 'N/A'}</div>
                        <div class="vector-font"><b>TEMP:</b> ${v.metrics?.vectorString || 'N/A'}/E:P/RL:O/RC:C</div>
                    </td>
                    <td style="width:10%">
                        <span class="badge ${bScore>=7?'bg-red':'bg-orange'}">${bScore.toFixed(1)}</span>
                    </td>
                    <td style="width:25%">
                        <div class="decision-box">
                            <input type="checkbox" checked title="Valider cette décision">
                            <span class="badge ${ssvc.class}">${ssvc.label}</span>
                            <span style="font-size:0.7rem; opacity:0.7">(Conseillé)</span>
                        </div>
                    </td>
                </tr>`;
            }).join('');

            container.innerHTML += `
                <div class="ecu-section" data-ecu="${ecu.component_id}">
                    <h3 style="color:var(--accent-blue)">${ecu.component_id} <span style="font-size:0.8rem; color:#8b949e"> — Impact Safety: ${ecu.safety_impact}</span></h3>
                    <table>
                        <thead><tr><th>CVE / CWE</th><th>Vecteurs CVSS</th><th>Score</th><th>Décision SSVC</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        });
    }

    function applyFilter() {
        const val = document.getElementById('ecuFilter').value;
        document.querySelectorAll('.ecu-section[data-ecu]').forEach(el => {
            if (val === "ALL" || el.getAttribute('data-ecu') === val) el.classList.remove('hidden');
            else el.classList.add('hidden');
        });
    }

    // Fonction d'export PDF
    async function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const element = document.getElementById('report-content');
        
        // On cache temporairement les contrôles pour le PDF
        document.querySelector('.controls').style.display = 'none';

        html2canvas(element, { backgroundColor: "#0d1117", scale: 2 }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const imgProps = doc.getImageProperties(imgData);
            const pdfWidth = doc.internal.pageSize.getWidth();
            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
            
            doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            doc.save(`OOAC_VDR_Report_${new Date().toISOString().slice(0,10)}.pdf`);
            
            document.querySelector('.controls').style.display = 'flex';
        });
    }

    window.onload = init;
</script>
</body>
</html>
