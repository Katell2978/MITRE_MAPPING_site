<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OOAC — VIE Master Dashboard (SSVC + Exploit Maturity)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0d1117; --card-dark: #161b22; --border-gray: #30363d;
            --accent-blue: #58a6ff; --accent-red: #f85149; --accent-orange: #f0883e;
            --accent-purple: #bc8cff; --accent-green: #3fb950;
        }
        body { background: var(--bg-dark); color: #c9d1d9; font-family: -apple-system, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1600px; margin: 0 auto; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-gray); padding-bottom: 20px; }
        .controls { display: flex; gap: 10px; }
        
        select, button { background: #21262d; color: white; border: 1px solid var(--border-gray); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        select:focus { border-color: var(--accent-blue); outline: none; }
        
        .ecu-section { background: var(--card-dark); border: 1px solid var(--border-gray); border-radius: 8px; margin-bottom: 30px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { text-align: left; font-size: 0.7rem; color: #8b949e; text-transform: uppercase; padding: 12px; border-bottom: 2px solid var(--border-gray); }
        td { padding: 12px; border-bottom: 1px solid #30363d; vertical-align: middle; font-size: 0.85rem; }

        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; display: inline-block; border: 1px solid transparent; }
        .bg-red { background: rgba(248,81,73,0.15); color: var(--accent-red); border-color: var(--accent-red); }
        .bg-orange { background: rgba(240,136,62,0.15); color: var(--accent-orange); border-color: var(--accent-orange); }
        .bg-blue { background: rgba(88,166,255,0.15); color: var(--accent-blue); border-color: var(--accent-blue); }
        .bg-gray { background: rgba(110,118,129,0.15); color: #8b949e; border-color: #30363d; }

        .exploit-select { background: #0d1117; border: 1px solid #444; color: #fff; padding: 4px; border-radius: 4px; width: 100%; }
        .vector-font { font-family: 'Courier New', monospace; font-size: 0.75rem; color: #8b949e; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container" id="report-content">
    <div class="header-flex">
        <div>
            <h1 style="color:var(--accent-blue); margin:0;">🛡️ OOAC : Decision Dashboard</h1>
            <p style="color:#8b949e; margin:5px 0 0 0;">Analyse SSVC croisée : Impact Safety x Maturité Exploit</p>
        </div>
        <div class="controls">
            <select id="ecuFilter" onchange="applyFilter()"><option value="ALL">Toutes les ECU</option></select>
            <button onclick="exportPDF()" style="background:var(--accent-green); border:none;">📥 Export PDF</button>
        </div>
    </div>

    <div class="ecu-section" style="border-left: 4px solid var(--accent-purple); display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h4 style="margin:0 0 10px 0;">⚖️ Logique SSVC Intégrée</h4>
            <span class="badge bg-red">IMMEDIATE</span> : Exploit Active OU (POC + Safety High)<br>
            <span class="badge bg-orange">SCHEDULED</span> : POC + Safety Low OU Unknown + Safety High<br>
            <span class="badge bg-blue">TRACK</span> : Unknown + Safety Low
        </div>
        <div style="text-align: right; font-size: 0.8rem;" class="muted">
            Mise à jour : <span id="current-date"></span>
        </div>
    </div>

    <div id="ecu-details-container"></div>
</div>

<script>
    let inventory = [];
    let vulnsData = [];

    // ✅ LOGIQUE SSVC MISE À JOUR
    function calculateSSVC(score, exploitMaturity, safetyImpact) {
        const isSafetyHigh = safetyImpact === "High";
        
        if (exploitMaturity === "Active") return { label: "IMMEDIATE", class: "bg-red" };
        
        if (exploitMaturity === "POC") {
            return isSafetyHigh ? { label: "IMMEDIATE", class: "bg-red" } : { label: "SCHEDULED", class: "bg-orange" };
        }
        
        if (exploitMaturity === "Unknown") {
            return isSafetyHigh ? { label: "SCHEDULED", class: "bg-orange" } : { label: "TRACK", class: "bg-blue" };
        }
        
        return { label: "TRACK", class: "bg-blue" };
    }

    async function init() {
        document.getElementById('current-date').innerText = new Date().toLocaleDateString();
        try {
            const [invRes, vulnRes] = await Promise.all([
                fetch('data/inventory/inventory_cpe.json'),
                fetch('data/results/detected_vulns.json')
            ]);
            inventory = await invRes.json();
            vulnsData = await vulnRes.json();
            
            inventory.forEach(e => {
                const opt = document.createElement('option');
                opt.value = e.component_id; opt.textContent = e.component_id;
                document.getElementById('ecuFilter').appendChild(opt);
            });
            render();
        } catch(e) { console.error(e); }
    }

    function updateLineSSVC(cveId, ecuId) {
        const select = document.getElementById(`exploit-${cveId}`);
        const badgeCont = document.getElementById(`ssvc-badge-${cveId}`);
        const ecu = inventory.find(i => i.component_id === ecuId);
        const vuln = vulnsData.find(v => v.cve_id === cveId);
        
        const decision = calculateSSVC(vuln.metrics?.baseScore || 0, select.value, ecu.safety_impact);
        badgeCont.innerHTML = `<span class="badge ${decision.class}">${decision.label}</span>`;
    }

    function render() {
        const container = document.getElementById('ecu-details-container');
        container.innerHTML = "";

        inventory.forEach(ecu => {
            let ev = vulnsData.filter(v => v.ecu === ecu.component_id);
            if (ev.length === 0) return;

            let rows = ev.map(v => {
                const bScore = v.metrics?.baseScore || 0;
                const cwe = (v.cwe_ids && v.cwe_ids.length > 0) ? v.cwe_ids[0] : "N/A";
                
                // Détermination état initial
                let initialExploit = "Unknown";
                if (v.is_kev || v.description?.toLowerCase().includes("active exploit")) initialExploit = "Active";
                
                const ssvc = calculateSSVC(bScore, initialExploit, ecu.safety_impact);

                return `
                <tr>
                    <td style="width:12%"><b>${v.cve_id}</b><br><span class="badge bg-gray" style="margin-top:5px">${cwe}</span></td>
                    <td style="width:38%">
                        <div class="vector-font"><b>BASE:</b> ${v.metrics?.vectorString || 'N/A'}</div>
                        <div class="vector-font" style="margin-top:3px; opacity:0.7;">Temp: ${(bScore*0.95).toFixed(1)} (E:P/RL:O/RC:C)</div>
                    </td>
                    <td style="width:15%">
                        <select class="exploit-select" id="exploit-${v.cve_id}" onchange="updateLineSSVC('${v.cve_id}', '${ecu.component_id}')">
                            <option value="Unknown" ${initialExploit==='Unknown'?'selected':''}>🔘 Unknown</option>
                            <option value="POC" ${initialExploit==='POC'?'selected':''}>🧪 POC</option>
                            <option value="Active" ${initialExploit==='Active'?'selected':''}>🔥 Active</option>
                        </select>
                    </td>
                    <td style="width:15%; text-align:center;" id="ssvc-badge-${v.cve_id}">
                        <span class="badge ${ssvc.class}">${ssvc.label}</span>
                    </td>
                    <td style="width:20%; text-align:right;">
                        <input type="checkbox" checked> <span style="font-size:0.8rem">Approuvé</span>
                        <br><small class="muted">Par expert cyber</small>
                    </td>
                </tr>`;
            }).join('');

            container.innerHTML += `
                <div class="ecu-section" data-ecu="${ecu.component_id}">
                    <h3 style="color:var(--accent-blue); margin-top:0;">
                        ${ecu.component_id} <span style="font-size:0.8rem; color:#8b949e; font-weight:normal;"> — Impact Safety: ${ecu.safety_impact}</span>
                    </h3>
                    <table>
                        <thead>
                            <tr>
                                <th>CVE / CWE</th>
                                <th>Vecteurs Techniques</th>
                                <th>État Exploit</th>
                                <th style="text-align:center;">Proposition SSVC</th>
                                <th style="text-align:right;">Décision Finale</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        });
    }

    function applyFilter() {
        const val = document.getElementById('ecuFilter').value;
        document.querySelectorAll('.ecu-section[data-ecu]').forEach(el => {
            if (val === "ALL" || el.getAttribute('data-ecu') === val) el.classList.remove('hidden');
            else el.classList.add('hidden');
        });
    }

    async function exportPDF() {
        const { jsPDF } = window.jspdf;
        const element = document.getElementById('report-content');
        const controls = document.querySelector('.controls');
        
        controls.style.visibility = 'hidden';
        
        html2canvas(element, { backgroundColor: "#0d1117", scale: 2 }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const doc = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = doc.internal.pageSize.getWidth();
            const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
            
            doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            doc.save(`OOAC_SSVC_Decision_${new Date().toISOString().slice(0,10)}.pdf`);
            controls.style.visibility = 'visible';
        });
    }

    window.onload = init;
</script>
</body>
</html>
