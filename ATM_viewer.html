<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ATM Detection Coverage Matrix</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }

  h1 {
    margin-bottom: 10px;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: center;
    font-size: 12px;
  }

  th {
    background: #f0f0f0;
    position: sticky;
    top: 0;
    z-index: 2;
  }

  td.tech {
    cursor: pointer;
    font-weight: bold;
  }

  td.detected {
    background-color: #b6e3b6; /* vert */
  }

  td.not-detected {
    background-color: #f5f5f5;
  }

  .legend {
    margin-top: 10px;
  }

  .legend span {
    display: inline-block;
    padding: 4px 10px;
    margin-right: 10px;
    border: 1px solid #ccc;
  }

  .legend .detected {
    background-color: #b6e3b6;
  }

  .legend .not-detected {
    background-color: #f5f5f5;
  }
</style>
</head>

<body>

<h1>Automotive Threat Matrix – Detection Coverage</h1>

<!-- === Chargement fichier local === -->
<p>
  <strong>Charger un JSON depuis votre poste :</strong><br>
  <input type="file" id="fileInput" accept=".json">
</p>

<!-- === Chargement par URL (optionnel) === -->
<p>
  <strong>Ou charger depuis une URL :</strong><br>
  <input type="text" id="jsonUrl" size="80"
         placeholder="ATM_Techniques_with_detection.json">
  <button onclick="loadFromUrl()">Charger</button>
</p>

<div id="matrix"></div>

<div class="legend">
  <span class="detected">Détection présente</span>
  <span class="not-detected">Pas de détection</span>
</div>

<script>
/* =========================
   UTILITAIRES
   ========================= */

function buildMatrix(data) {
  // Collect all tactics
  const tactics = [...new Set(
    data.flatMap(t => t.tactic)
  )].sort();

  // Group techniques by tactic
  const byTactic = {};
  tactics.forEach(t => byTactic[t] = []);
  data.forEach(t => {
    t.tactic.forEach(tc => byTactic[tc].push(t));
  });

  // Build table
  let html = '<table>';
  html += '<tr><th>Tactic</th><th>Technique</th></tr>';

  tactics.forEach(tactic => {
    const techniques = byTactic[tactic];

    techniques.forEach((tech, index) => {
      html += '<tr>';

      if (index === 0) {
        html += `<th rowspan="${techniques.length}">${tactic}</th>`;
      }

      const cls = tech.covered_by_detection
        ? 'detected'
        : 'not-detected';

      html += `
        <td class="tech ${cls}"
            title="${tech.description}">
          ${tech.id}
        </td>
      `;
      html += '</tr>';
    });
  });

  html += '</table>';
  document.getElementById('matrix').innerHTML = html;
}

/* =========================
   CHARGEMENT LOCAL
   ========================= */

document.getElementById('fileInput').addEventListener('change', function (event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const json = JSON.parse(e.target.result);
      buildMatrix(json);
    } catch (err) {
      alert('Erreur : fichier JSON invalide');
    }
  };
  reader.readAsText(file);
});

/* =========================
   CHARGEMENT URL
   ========================= */

async function loadFromUrl() {
  const url = document.getElementById('jsonUrl').value;
  if (!url) return;

  try {
    const response = await fetch(url);
    const json = await response.json();
    buildMatrix(json);
  } catch (err) {
