<body>
<header>
  <nav>
    <a href="index.html">🔍 Analyseur</a>

  <h1>Kat‑Force — Décision & Priorisation (SSVC)</h1>
</header>

<main>

<div class="card">
  <h2>Résumé & Scores</h2>

  <div class="kpiGrid">

    <!-- CVSS -->
    <div class="kpi">
      <div class="title">CVSS v3.x</div>
      <div id="cvss3" class="value">—</div>
      <div id="cvss3vec" class="sub">—</div>
    </div>

    <!-- CVSS v4 -->
    <div class="kpi">
      <div class="title">CVSS v4.0</div>
      <div id="cvss4" class="value">—</div>
      <div id="cvss4vec" class="sub">—</div>
    </div>

    <!-- EPSS -->
    <div class="kpi">
      <div class="title">EPSS (30j)</div>
      <div id="epss" class="value">—</div>
      <div id="epssPct" class="sub">—</div>
    </div>

    <!-- KEV -->
    <div class="kpi">
      <div class="title">KEV (CISA)</div>
      <div id="kev" class="value">—</div>
      <div id="kevDate" class="sub">—</div>
    </div>

    <!-- ✅ CWE KPI CORRIGÉ -->
    <div class="kpi">
      <div class="title">Weakness (CWE)</div>
      <div id="cweId" class="value" style="font-size:30px;font-weight:800;">—</div>
      <div id="cweName" class="sub">—</div>
      <div id="cweSource" class="tiny muted">—</div>
    </div>

  </div>
</div>

</main>

<script type="module">
  const $ = id => document.getElementById(id);

  /* CWE critique : memory / corruption */
  const CRITICAL_CWE = new Set([
    "CWE-119","CWE-120","CWE-121","CWE-122","CWE-124",
    "CWE-125","CWE-787","CWE-416"
  ]);

  function extractPrimaryCwe(weaknesses) {
    for (const w of weaknesses ?? []) {
      const desc = (w.description ?? []).find(d => d.lang === "en");
      if (!desc?.value) continue;

      const m = desc.value.match(/CWE-(\d{1,5})/);
      if (!m) continue;

      return {
        id: `CWE-${m[1]}`,
        name: desc.value.replace(/CWE-\d{1,5}\s*[:–-]?\s*/i, "").trim(),
        source: w.source ?? "NVD"
      };
    }
    return null;
  }

  /* ===== Exemple d’intégration dans analyze() ===== */
  async function renderCwe(cve) {
    const primaryCwe = extractPrimaryCwe(cve.weaknesses);

    if (!primaryCwe) {
      $("cweId").textContent = "—";
      $("cweName").textContent = "No weakness listed";
      $("cweSource").textContent = "—";
      return;
    }

    $("cweId").textContent = primaryCwe.id;
    $("cweName").textContent = primaryCwe.name;
    $("cweSource").textContent = `Source: ${primaryCwe.source}`;

    const isCritical = CRITICAL_CWE.has(primaryCwe.id);
    $("cweId").classList.toggle("crit", isCritical);
    $("cweName").classList.toggle("crit", isCritical);
  }

</script>
