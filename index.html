<main>

<!-- ================= KPI ================= -->
<div class="card">
<h2>Résumé & Scores</h2>

<div class="kpiGrid">

<div class="kpi">
<div class="title">CVSS v3.x</div>
<div id="cvss3" class="value">—</div>
<div id="cvss3vec" class="sub">—</div>
</div>

<div class="kpi">
<div class="title">CVSS v4.0</div>
<div id="cvss4" class="value">—</div>
<div id="cvss4vec" class="sub">—</div>
</div>

<div class="kpi">
<div class="title">EPSS (30j)</div>
<div id="epss" class="value">—</div>
<div id="epssPct" class="sub">—</div>
</div>

<div class="kpi">
<div class="title">KEV (CISA)</div>
<div id="kev" class="value">—</div>
<div id="kevDate" class="sub">—</div>
</div>

<!-- ✅ KPI CWE CORRIGÉ -->
<div class="kpi">
<div class="title">Weakness (CWE)</div>
<div id="cweId" class="value" style="font-size:30px;font-weight:800;">—</div>
<div id="cweName" class="sub">—</div>
<div id="cweSource" class="tiny muted">—</div>
</div>

</div>
</div>

<!-- ================= DETAILS ================= -->
<div class="card">
<h2>Détail CVE / Contexte</h2>
<div id="cveDetail" class="small muted">—</div>
</div>

</main>

<script type="module">
const $ = id => document.getElementById(id);

/* ================= CWE ================= */

const CRITICAL_CWE = new Set([
  "CWE-119","CWE-120","CWE-121","CWE-122",
  "CWE-124","CWE-125","CWE-787","CWE-416"
]);

function extractPrimaryCweDetailed(weaknesses) {
  for (const w of weaknesses ?? []) {
    const d = (w.description ?? []).find(x => x.lang === "en");
    if (!d?.value) continue;
    const m = d.value.match(/CWE-(\d{1,5})/);
    if (!m) continue;
    return {
      id: `CWE-${m[1]}`,
      name: d.value.replace(/CWE-\d{1,5}\s*[:–-]?\s*/i,"").trim(),
      source: w.source ?? "NVD"
    };
  }
  return null;
}

/* ================= ANALYSE CVE ================= */

async function analyze() {
  const cveId = "CVE-2025-32058"; // exemple
  const nvd = await fetch(`https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=${cveId}`).then(r=>r.json());
  const cve = nvd?.vulnerabilities?.[0]?.cve;
  if (!cve) return;

  const cwe = extractPrimaryCweDetailed(cve.weaknesses);

  if (cwe) {
    $("cweId").textContent = cwe.id;
    $("cweName").textContent = cwe.name;
    $("cweSource").textContent = `Source: ${cwe.source}`;

    const crit = CRITICAL_CWE.has(cwe.id);
    $("cweId").classList.toggle("crit", crit);
    $("cweName").classList.toggle("crit", crit);
  } else {
    $("cweId").textContent = "—";
    $("cweName").textContent = "No weakness listed";
    $("cweSource").textContent = "—";
  }

  $("cveDetail").innerHTML = `
    <b>${cveId}</b><br/>
    ${cve.descriptions?.[0]?.value ?? ""}
  `;
}

analyze();
</script>
