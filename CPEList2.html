<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>CPEList — Analyse OFFLINE (tri & filtres)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ======================================================
       STYLE : volontairement identique / très proche
       ====================================================== -->
  <style>
    :root{
      --bg:#0b1020; --card:#121a33; --text:#e9ecf5; --muted:#a7b0d6;
      --accent:#7aa2ff; --danger:#ff6b6b; --ok:#2dd4bf; --warn:#fbbf24;
      --border:rgba(255,255,255,.12);
    }
    body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text);}
    header{padding:20px;max-width:1300px;margin:auto;}
    h1{margin:0;font-size:20px;}
    p{color:var(--muted);}
    .wrap{max-width:1300px;margin:auto;padding:0 20px 40px;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:16px;}
    table{width:100%;border-collapse:collapse;font-size:12px;}
    th,td{padding:7px;border-bottom:1px solid var(--border);}
    th{color:var(--muted);text-align:left;cursor:pointer;}
    tr:hover td{background:rgba(122,162,255,.05);}
    .mono{font-family:ui-monospace;font-size:11px;}
    .right{text-align:right;}
    .badge{padding:2px 8px;border-radius:999px;font-size:11px;}
    .bad{background:rgba(255,107,107,.2);color:#ff9b9b;}
    .warn{background:rgba(251,191,36,.2);color:#fcd34d;}
    .ok{background:rgba(45,212,191,.2);color:#5eead4;}
    label{margin-right:16px;font-size:12px;}
    input[type=range]{vertical-align:middle;}
    select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;}
  </style>
</head>

<body>

<header>
  <h1>📦 CPEList — Analyse vulnérabilités OFFLINE</h1>
  <p>Base JSON locale — tri & filtres orientés <strong>priorisation risque véhicule</strong></p>
</header>

<div class="wrap">

  <!-- ======================================================
       Sources / dates dumps
       ====================================================== -->
  <div class="card">
    <strong>Sources OFFLINE</strong>
    <div id="sources" class="mono">Chargement…</div>
  </div>

  <!-- ======================================================
       FILTRES (ajoutés)
       ====================================================== -->
  <div class="card">
    <strong>Filtres & tri</strong><br><br>

    <label>
      🔥 KEV uniquement
      <input type="checkbox" id="fKev">
    </label>

    <label>
      🧨 RCE uniquement
      <input type="checkbox" id="fRce">
    </label>

    <label>
      🧠 Score ≥
      <input type="range" id="fScore" min="0" max="15" step="0.5" value="0">
      <span id="fScoreVal">0</span>
    </label>

    <label>
      Tri :
      <select id="sortBy">
        <option value="score">Score risque</option>
        <option value="cvss">CVSS</option>
        <option value="cve">#CVE</option>
      </select>
    </label>
  </div>

  <!-- ======================================================
       TABLEAU (inchangé visuellement)
       ====================================================== -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>CPE</th>
          <th class="right">#CVE</th>
          <th class="right">CVSS max</th>
          <th class="right">EPSS max</th>
          <th>KEV</th>
          <th>CWE</th>
          <th class="right">Score risque</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
// ======================================================
// OFFLINE CPEList — logique analyste cyber
// ======================================================

const DB_URL = "./data/offline_cpe_db.json";
const tbody = document.getElementById("tbody");

// filtres
const fKev = document.getElementById("fKev");
const fRce = document.getElementById("fRce");
const fScore = document.getElementById("fScore");
const fScoreVal = document.getElementById("fScoreVal");
const sortBy = document.getElementById("sortBy");

let ENTRIES = [];

// ------------------------------------------------------
// Heuristique RCE basée sur CWE (simple & explicable)
// ------------------------------------------------------
function isRce(cwes){
  return (cwes || []).some(c =>
    c.includes("CWE-78") ||   // OS Command Injection
    c.includes("CWE-94") ||   // Code Injection
    c.includes("CWE-502") ||  // Deserialization
    c.includes("CWE-787") ||  // Memory corruption exploitable
    c.includes("CWE-416")
  );
}

// ------------------------------------------------------
function sevClass(v){
  if(v>=9) return "bad";
  if(v>=7) return "warn";
  return "ok";
}

function scoreRisque(cvss, epss, kev){
  if(cvss==null) return 0;
  return +(cvss * (kev?1.5:1) * (epss||0.01)).toFixed(2);
}

// ------------------------------------------------------
// RENDER avec filtres / tri
// ------------------------------------------------------
function render(){
  tbody.innerHTML = "";
  fScoreVal.textContent = fScore.value;

  let list = ENTRIES.filter(e => {
    if(fKev.checked && !e.summary.kev) return false;
    if(fRce.checked && !isRce(e.summary.cwe)) return false;
    if(scoreRisque(e.summary.cvss_max, e.summary.epss_max, e.summary.kev) < fScore.value)
      return false;
    return true;
  });

  // tri
  list.sort((a,b)=>{
    if(sortBy.value==="cvss")
      return (b.summary.cvss_max||0)-(a.summary.cvss_max||0);
    if(sortBy.value==="cve")
      return (b.summary.cve_count||0)-(a.summary.cve_count||0);
    return scoreRisque(b.summary.cvss_max,b.summary.epss_max,b.summary.kev)
         - scoreRisque(a.summary.cvss_max,a.summary.epss_max,a.summary.kev);
  });

  for(const e of list){
    const s = e.summary;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="mono">${e.cpe}</td>
      <td class="right">${s.cve_count}</td>
      <td class="right"><span class="badge ${sevClass(s.cvss_max)}">${s.cvss_max ?? "—"}</span></td>
      <td class="right">${s.epss_max ?? "—"}</td>
      <td>${s.kev ? "🔥 KEV" : ""}</td>
      <td>${(s.cwe||[]).join(", ") || "—"}</td>
      <td class="right"><strong>${scoreRisque(s.cvss_max,s.epss_max,s.kev)}</strong></td>
    `;
    tbody.appendChild(tr);
  }
}

// ------------------------------------------------------
// INIT
// ------------------------------------------------------
fetch(DB_URL)
  .then(r=>r.json())
  .then(db=>{
    ENTRIES = db.cpe_entries || [];

    // sources
    const m = db._meta || {};
    const s = m.sources || {};
    document.getElementById("sources").innerHTML = `
      Généré le : ${m.generated_at || "—"}<br>
      NVD : ${s.NVD || "—"}<br>
      EUVD : ${s.EUVD || "—"}<br>
      OSV : ${s.OSV || "—"}
    `;

    render();
  });

// events filtres
[fKev,fRce,fScore,sortBy].forEach(el=>el.addEventListener("change",render));

</script>
</body>
</html>
