name: NVD initial dump
on:
  workflow_dispatch:

jobs:
  nvd-init:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # important

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create output directory
        run: mkdir -p data/nvd

      - name: Run NVD initial dump (limited years)
        run: |
          python scripts/nvd_mirror.py \
            --mode init \
            --start-year 2018 \
            --out data/nvd

      - name: Show downloaded files
        run: ls -lh data/nvd
