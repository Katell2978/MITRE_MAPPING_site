name: "VIE - NVD Scan & Archive"

on:
  workflow_dispatch: # Déclenchement manuel via le bouton bleu sur GitHub

jobs:
  scan_and_archive:
    runs-on: ubuntu-latest
    
    # Indispensable pour que l'Action puisse écrire (push) dans le repo
    permissions:
      contents: write

    steps:
      - name: 🛒 Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère tout l'historique pour éviter les conflits de push

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Exécution du Scanner NVD
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/nvd_scanner.py

      - name: 💾 Sauvegarde et Archivage sur GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ajoute tous les nouveaux fichiers dans data/results/
          git add data/results/*.json
          
          # On commit seulement s'il y a des changements
          timestamp=$(date +'%Y-%m-%d %H:%M')
          git commit -m "🤖 VIE Auto-Scan: $timestamp [Archive + Latest]" || echo "Aucun changement détecté"
          
          # Push vers la branche principale
          git push
