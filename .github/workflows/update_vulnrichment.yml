name: Mettre à jour les données Vulnrichment

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Cloner votre dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécuter le script de récupération
        run: python scripts/fetch_vulnrichment.py

      - name: Commit et push automatiques si les données ont changé
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main --rebase || true
          
          git add data/vulnrichment_summary/
          git diff --staged --quiet || git commit -m "Mise à jour automatique des données CISA Vulnrichment par année"
          git push
