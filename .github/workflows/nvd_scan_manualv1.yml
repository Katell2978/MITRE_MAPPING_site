name: "VIE - Manual NVD Scan for CPE inventory"

on:
  workflow_dispatch: # Permet le déclenchement manuel via l'onglet 'Actions'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/checkout@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Run NVD Scanner
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }} # Utilise le secret si défini
        run: python scripts/nvd_scanner.py

      - name: 💾 Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results/detected_vulns.json
          git commit -m "🤖 Auto-update: NVD Scan Results [$(date +'%Y-%m-%d %H:%M')]" || echo "No changes to commit"
          git push
