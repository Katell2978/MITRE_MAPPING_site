<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIE Master Dashboard Demonstrateur avec Fausses Données</title>
    <style>
        :root {
            --bg-dark: #0d1117; --card-dark: #161b22; --border-gray: #30363d;
            --accent-blue: #58a6ff; --accent-red: #f85149; --accent-orange: #f0883e;
            --accent-purple: #bc8cff; --accent-green: #3fb950;
        }
        body { background: var(--bg-dark); color: #c9d1d9; font-family: -apple-system, system-ui, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-gray); padding-bottom: 20px; }
        .filter-box { background: var(--card-dark); border: 1px solid var(--border-gray); padding: 10px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
        select { background: #0d1117; color: var(--accent-blue); border: 1px solid var(--border-gray); padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; outline: none; }
        
        #debug-monitor { background: #000; border: 1px solid var(--border-gray); color: var(--accent-green); font-family: monospace; font-size: 0.7rem; padding: 10px; margin-bottom: 20px; border-radius: 6px; max-height: 80px; overflow-y: auto; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card-dark); border: 1px solid var(--border-gray); padding: 20px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 2.2rem; font-weight: 800; display: block; color: #fff; }
        .stat-label { color: #8b949e; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }

        .summary-wrapper { background: var(--card-dark); border: 1px solid var(--border-gray); border-radius: 8px; margin-bottom: 20px; padding: 20px; }
        .summary-table, .table-res { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 0.75rem; color: #8b949e; padding: 12px; border-bottom: 2px solid var(--border-gray); text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: top; }

        .methodology-box { background: #1c2128; border: 1px solid var(--border-gray); padding: 20px; margin-bottom: 30px; border-radius: 8px; border-left: 4px solid var(--accent-blue); }
        .methodology-box h3 { color: var(--accent-blue); margin-top: 0; font-size: 0.9rem; text-transform: uppercase; }
        .formula { font-family: monospace; background: #0d1117; padding: 10px; border-radius: 4px; display: block; margin: 10px 0; color: var(--accent-green); border: 1px solid var(--border-gray); }

        .ecu-section { margin-bottom: 40px; background: var(--card-dark); border: 1px solid var(--border-gray); border-radius: 8px; overflow: hidden; }
        .ecu-header { background: #1c2128; padding: 15px 20px; border-bottom: 1px solid var(--border-gray); display: flex; justify-content: space-between; align-items: center; }
        
        .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.65rem; font-weight: bold; border: 1px solid transparent; display: inline-block; margin-right: 4px; cursor: help; }
        .bg-red { background: rgba(248,81,73,0.15); color: var(--accent-red); border-color: var(--accent-red); }
        .bg-orange { background: rgba(240,136,62,0.15); color: var(--accent-orange); border-color: var(--accent-orange); }
        .bg-purple { background: rgba(188,140,255,0.15); color: var(--accent-purple); border-color: var(--accent-purple); }
        .bg-gray { background: rgba(110,118,129,0.15); color: #c9d1d9; border-color: #444c56; }
        .bg-blue { background: rgba(88,166,255,0.15); color: var(--accent-blue); border-color: var(--accent-blue); }
        
        a.cve-link { color: var(--accent-blue); text-decoration: none; font-weight: bold; }
        a.cve-link:hover { text-decoration: underline; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <div>
            <h1 style="color:var(--accent-blue); margin:0;">VIE Advanced Vuln Dashboard</h1>
            <p style="color:#8b949e; font-size: 0.9rem; margin:5px 0;">Analyse de vulnérabilité (En cours de dev).</p>
        </div>
        <div class="filter-box">
            <select id="ecuFilter" onchange="applyFilter()"><option value="ALL">Tout le véhicule</option></select>
        </div>
    </div>

    <div id="debug-monitor">> Chargement des moteurs de calcul...</div>

    <div class="stats-grid">
        <div class="stat-card"><span id="total-cve" class="stat-value">0</span><span class="stat-label">CVE Détectées</span></div>
        <div class="stat-card"><span id="total-kev" class="stat-value" style="color:var(--accent-red)">0</span><span class="stat-label">KEV Exploités</span></div>
        <div class="stat-card"><span id="total-rce" class="stat-value" style="color:var(--accent-purple)">0</span><span class="stat-label">Vecteurs RCE</span></div>
        <div class="stat-card" style="border-bottom: 3px solid var(--accent-green);"><span id="avg-risk" class="stat-value">0</span><span class="stat-label">Score Risque Scope</span></div>
    </div>

    <div class="summary-wrapper">
        <h3 style="margin-top:0; color:var(--accent-blue); font-size:1rem;">📊 Synthèse par Unité</h3>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>UNITÉ</th>
                    <th>VULNÉRABILITÉS</th>
                    <th>KEV</th>
                    <th>SÉVÉRITÉ MAX (BASE)</th>
                    <th style="text-align:right;">UNIT RISK SCORE</th>
                </tr>
            </thead>
            <tbody id="summary-body"></tbody>
        </table>
    </div>

    <div id="ecu-details-container"></div>
</div>

<script>
    let inventory = [];
    let vulnsData = [];
    let processedData = []; // Stockage global pour recalculer les KPIs au filtrage

    function cleanProductName(cpe) {
        if (!cpe) return "N/A";
        const p = cpe.split(':');
        return p.length > 4 ? `${p[3].toUpperCase()} ${p[4].replace(/_/g, ' ')}` : cpe;
    }

    function calculateLineRisk(cvssTemp, isRce, isKev) {
        let score = cvssTemp * 10;
        if (isRce) score *= 1.1;
        if (isKev) score *= 1.2;
        return Math.min(100, Math.round(score));
    }

    function calculateECURisk(cvssArray, hasRce, hasKev) {
        if (cvssArray.length === 0) return 0;
        const maxBase = Math.max(...cvssArray);
        const count = cvssArray.length;
        let score = maxBase * 7; 
        score += 15 * (count / (count + 20)); 
        if (hasRce) score *= 1.10;
        if (hasKev) score *= 1.05;
        return Math.min(100, Math.round(score));
    }

    async function init() {
        try {
            const invRes = await fetch('data/inventory/inventory_cpe.json');
            inventory = await invRes.json();
            const vulnRes = await fetch('data/results/detected_vulns.json');
            vulnsData = await vulnRes.json();
            renderDashboard();
        } catch(e) { console.error(e); }
    }

    function renderDashboard() {
        const filterSelect = document.getElementById('ecuFilter');
        const summaryBody = document.getElementById('summary-body');
        const detailsContainer = document.getElementById('ecu-details-container');
        
        processedData = [];

        inventory.forEach(item => {
            const ecuId = item.component_id;
            const ecuName = item.description || "N/A";

            const opt = document.createElement('option');
            opt.value = ecuId; opt.textContent = `${ecuId} - ${ecuName}`;
            filterSelect.appendChild(opt);

            const ev = vulnsData.filter(v => v.ecu === ecuId);
            let eRceCount = 0, eKevCount = 0;
            let allCvss = ev.map(v => v.metrics?.baseScore || 0);

            // Préparation des lignes détaillées avec calcul du risque individuel pour le tri
            let detailItems = ev.map(v => {
                const cvssBase = v.metrics?.baseScore || 0;
                const cvssTemp = v.metrics?.temporalScore || (cvssBase * 0.9).toFixed(1);
                const isRce = v.description.toLowerCase().includes("remote code") || v.description.toLowerCase().includes(" rce ");
                const isKev = v.is_kev === true || v.is_kev === "true";
                const lineRisk = calculateLineRisk(cvssTemp, isRce, isKev);
                
                if (isRce) eRceCount++;
                if (isKev) eKevCount++;

                return { ...v, cvssBase, cvssTemp, isRce, isKev, lineRisk };
            });

            // TRI PAR RISQUE DÉCROISSANT
            detailItems.sort((a, b) => b.lineRisk - a.lineRisk);

            const eRiskScore = calculateECURisk(allCvss, eRceCount > 0, eKevCount > 0);
            processedData.push({ ecuId, ecuName, vulns: detailItems, eRiskScore, eRceCount, eKevCount, eMaxCvss: Math.max(...allCvss, 0) });

            let detailRows = detailItems.map(v => `
                <tr>
                    <td><a href="index.html?cve=${v.cve_id}" class="cve-link">${v.cve_id}</a></td>
                    <td style="color:var(--accent-blue)">${cleanProductName(v.cpe)}</td>
                    <td>
                        <div style="margin-bottom:5px;">${v.description.substring(0,80)}...</div>
                        ${v.isRce ? `<span class="badge bg-purple" title="ECU: ${ecuId} | CVE: ${v.cve_id}">RCE</span>` : ''}
                        ${v.isKev ? `<span class="badge bg-red" title="ECU: ${ecuId} | CVE: ${v.cve_id}">KEV</span>` : ''}
                    </td>
                    <td><span class="badge bg-gray">${v.cvssBase.toFixed(1)}</span></td>
                    <td><span class="badge bg-blue">${v.cvssTemp}</span></td>
                    <td style="text-align:right;">
                        <span style="font-weight:bold; color:${v.lineRisk > 85 ? 'var(--accent-red)' : v.lineRisk > 50 ? 'var(--accent-orange)' : 'white'}">${v.lineRisk}</span>
                    </td>
                </tr>`).join('');

            summaryBody.innerHTML += `
                <tr class="summary-row" data-ecu="${ecuId}">
                    <td><strong style="color:var(--accent-blue)">${ecuId}</strong><br><small>${ecuName}</small></td>
                    <td>${ev.length} CVE ${eRceCount ? `<span class="badge bg-purple" title="Contient des RCE">RCE</span>` : ''}</td>
                    <td>${eKevCount > 0 ? `<span class="badge bg-red" title="Contient des KEV">${eKevCount}</span>` : `<span style="color:#444">—</span>`}</td>
                    <td><span class="badge ${Math.max(...allCvss,0)>=7?'bg-red':'bg-orange'}">${Math.max(...allCvss,0).toFixed(1)}</span></td>
                    <td style="text-align:right;"><span style="font-weight:800; font-size:1.1rem; color:${eRiskScore>75?'var(--accent-red)':'var(--accent-green)'}">${eRiskScore}/100</span></td>
                </tr>`;

            detailsContainer.innerHTML += `
                <div class="ecu-section" data-ecu="${ecuId}">
                    <div class="ecu-header">
                        <h2 style="margin:0; font-size:1.1rem; color:var(--accent-blue)">${ecuId} — Détails (Triés par Risque)</h2>
                        <span class="badge bg-gray">ECU RISK: ${eRiskScore}/100</span>
                    </div>
                    <table class="table-res">
                        <thead><tr><th>CVE</th><th>PRODUIT</th><th>DESC / VECTEURS</th><th>BASE</th><th>TEMP</th><th style="text-align:right;">VIE RISK</th></tr></thead>
                        <tbody>${detailRows || '<tr><td colspan="6" style="text-align:center; padding:20px;">✅ Aucune menace détectée.</td></tr>'}</tbody>
                    </table>
                </div>`;
        });

        updateKPIs("ALL");
        document.getElementById('debug-monitor').innerText = "> Dashboard prêt. Tri par risque activé.";
    }

    function updateKPIs(filterValue) {
        let filtered = (filterValue === "ALL") ? processedData : processedData.filter(d => d.ecuId === filterValue);
        
        let totalCve = filtered.reduce((acc, d) => acc + d.vulns.length, 0);
        let totalKev = filtered.reduce((acc, d) => acc + d.eKevCount, 0);
        let totalRce = filtered.reduce((acc, d) => acc + d.eRceCount, 0);
        let avgRisk = Math.round(filtered.reduce((acc, d) => acc + d.eRiskScore, 0) / (filtered.length || 1));

        document.getElementById('total-cve').innerText = totalCve;
        document.getElementById('total-kev').innerText = totalKev;
        document.getElementById('total-rce').innerText = totalRce;
        document.getElementById('avg-risk').innerText = avgRisk;
    }

    function applyFilter() {
        const val = document.getElementById('ecuFilter').value;
        document.querySelectorAll('.summary-row, .ecu-section').forEach(el => {
            el.classList.toggle('hidden', val !== "ALL" && el.getAttribute('data-ecu') !== val);
        });
        updateKPIs(val);
    }

    window.onload = init;
</script>
</body>
</html>
