<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIE Advanced Risk Dashboard - SSVC & Synthèse</title>
    <style>
        :root {
            --bg-dark: #0d1117; --card-dark: #161b22; --border-gray: #30363d;
            --accent-blue: #58a6ff; --accent-red: #f85149; --accent-orange: #f0883e;
            --accent-purple: #bc8cff; --accent-green: #3fb950;
        }
        body { background: var(--bg-dark); color: #c9d1d9; font-family: -apple-system, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Header & Filter */
        .header-flex { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; }
        .header-left h1 { color: var(--accent-blue); margin: 0; font-size: 1.8rem; }
        .filter-box { background: var(--card-dark); border: 1px solid var(--border-gray); padding: 15px; border-radius: 8px; min-width: 320px; }
        select { background: #0d1117; color: var(--accent-blue); border: 1px solid var(--border-gray); padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; }

        /* Stats & Distribution */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card-dark); border: 1px solid var(--border-gray); padding: 20px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 2.2rem; font-weight: 800; display: block; color: #fff; }
        .stat-label { color: #8b949e; font-size: 0.7rem; text-transform: uppercase; }

        .decision-distribution { display: flex; gap: 10px; margin-bottom: 30px; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 8px; border: 1px dashed var(--border-gray); }
        .dist-item { flex: 1; padding: 10px; border-radius: 6px; text-align: center; font-size: 0.8rem; }

        /* Tables */
        .summary-wrapper { background: var(--card-dark); border: 1px solid var(--border-gray); border-radius: 8px; padding: 20px; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 0.7rem; color: #8b949e; padding: 12px; border-bottom: 1px solid var(--border-gray); }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .badge { padding: 2px 8px; border-radius: 12px; font-size: 0.65rem; font-weight: bold; border: 1px solid transparent; }
        .bg-red { background: rgba(248,81,73,0.15); color: var(--accent-red); border-color: var(--accent-red); }
        .bg-orange { background: rgba(240,136,62,0.15); color: var(--accent-orange); border-color: var(--accent-orange); }
        .bg-purple { background: rgba(188,140,255,0.15); color: var(--accent-purple); border-color: var(--accent-purple); }
        .bg-blue { background: rgba(88,166,255,0.15); color: var(--accent-blue); border-color: var(--accent-blue); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <div class="header-left">
            <h1>🛡️ VIE Advanced Risk Dashboard V2.1</h1>
            <p>Synthèse Executive & Décisions SSVC.</p>
        </div>
        <div class="filter-box">
            <select id="ecuFilter" onchange="applyFilter()">
                <option value="ALL">Tout le véhicule</option>
            </select>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><span id="total-cve" class="stat-value">0</span><span class="stat-label">CVE Détectées</span></div>
        <div class="stat-card" style="border-bottom: 3px solid var(--accent-red)"><span id="total-patch" class="stat-value" style="color:var(--accent-red)">0</span><span class="stat-label">Patch Immediate</span></div>
        <div class="stat-card" style="border-bottom: 3px solid var(--accent-orange)"><span id="total-ca" class="stat-value" style="color:var(--accent-orange)">0</span><span class="stat-label">CyberAnalysisReq</span></div>
        <div class="stat-card"><span id="avg-risk" class="stat-value">0</span><span class="stat-label">Score Risque Flotte</span></div>
    </div>

    <div class="decision-distribution" id="dist-container">
        </div>

    <div class="summary-wrapper">
        <h3 style="margin-top:0; font-size:1rem; color:var(--accent-blue)">📊 Synthèse par Unité</h3>
        <table>
            <thead>
                <tr>
                    <th>UNITÉ</th>
                    <th>VULNÉRABILITÉS</th>
                    <th>TOP DECISION SSVC</th>
                    <th style="text-align:right;">RISK SCORE (V1)</th>
                </tr>
            </thead>
            <tbody id="summary-body"></tbody>
        </table>
    </div>

    <div id="ecu-details-container"></div>
</div>

<script>
    let inventory = [];
    let vulnsData = [];
    let counts = { Patch_immediate: 0, Patch_schedule: 0, CyberAnalysisRequired: 0, Track: 0, Dismiss: 0 };

    function getSSVCDecision(v, ecu) {
        const cvss = v.metrics?.baseScore || 0;
        const cvssHigh = cvss >= 7;
        const exploit = (v.is_kev === true || v.is_kev === "true") ? "Active" : "None";
        const surface = ecu.is_exposed === true;
        const safety = (ecu.safety_impact === "High" || ecu.safety_impact === "Medium");
        const supplier = ecu.supplier_involvement;

        // CORRECTION : Logique plus robuste pour CyberAnalysisRequired
        if (cvssHigh && exploit === "Active" && surface) {
            if (safety && supplier === "Fix-ready") return { label: "Patch_immediate", color: "var(--accent-red)" };
            return { label: "CyberAnalysisRequired", color: "var(--accent-orange)" }; // Règle SSVC-ACT-CA & SSVC-ACT-SAFETY-NO
        }
        
        if (cvssHigh && exploit === "Active" && !surface) return { label: "Track", color: "var(--accent-blue)" };
        if (!cvssHigh) return { label: "Dismiss", color: "#6e7681" };
        
        return { label: "Track", color: "var(--accent-blue)" };
    }

    // Risque V1 (Image 1 & 2)
    function calculateV1Risk(cvssArray) {
        if (cvssArray.length === 0) return 0;
        const score = (Math.max(...cvssArray) * 8) + (cvssArray.length * 2);
        return Math.min(100, Math.round(score));
    }

    async function init() {
        const invRes = await fetch('data/inventory/inventory_cpe.json');
        inventory = await invRes.json();
        const vulnRes = await fetch('data/results/detected_vulns.json');
        vulnsData = await vulnRes.json();

        // Peupler le filtre
        const filter = document.getElementById('ecuFilter');
        inventory.forEach(ecu => {
            const opt = document.createElement('option');
            opt.value = ecu.component_id;
            opt.textContent = ecu.component_id;
            filter.appendChild(opt);
        });

        render();
    }

    function render() {
        const summaryBody = document.getElementById('summary-body');
        const detailsContainer = document.getElementById('ecu-details-container');
        let gRisk = 0;

        inventory.forEach(ecu => {
            const ev = vulnsData.filter(v => v.ecu === ecu.component_id);
            let detailRows = "";
            let topDec = "None";

            ev.forEach(v => {
                const ssvc = getSSVCDecision(v, ecu);
                counts[ssvc.label]++;
                if (ssvc.label === "Patch_immediate") topDec = "Patch_immediate";
                else if (ssvc.label === "CyberAnalysisRequired" && topDec !== "Patch_immediate") topDec = "CyberAnalysisRequired";

                detailRows += `<tr>
                    <td><strong>${v.cve_id}</strong></td>
                    <td><span class="badge ${v.metrics?.baseScore>=7?'bg-red':'bg-orange'}">${v.metrics?.baseScore}</span></td>
                    <td style="color:${ssvc.color}; font-weight:bold">${ssvc.label}</td>
                </tr>`;
            });

            const risk = calculateV1Risk(ev.map(v=>v.metrics?.baseScore||0));
            gRisk += risk;

            summaryBody.innerHTML += `
                <tr class="summary-row" data-ecu="${ecu.component_id}">
                    <td><strong>${ecu.component_id}</strong></td>
                    <td>${ev.length} CVE</td>
                    <td><span class="badge ${topDec==='Patch_immediate'?'bg-red':'bg-orange'}">${topDec}</span></td>
                    <td style="text-align:right; font-weight:bold; color:var(--accent-red)">${risk}/100</td>
                </tr>`;

            detailsContainer.innerHTML += `
                <div class="ecu-section summary-wrapper" data-ecu="${ecu.component_id}">
                    <h3 style="margin:0 0 15px 0; font-size:0.9rem;">Détails ${ecu.component_id}</h3>
                    <table><tbody>${detailRows}</tbody></table>
                </div>`;
        });

        // Mise à jour des compteurs globaux
        document.getElementById('total-cve').innerText = vulnsData.length;
        document.getElementById('total-patch').innerText = counts.Patch_immediate;
        document.getElementById('total-ca').innerText = counts.CyberAnalysisRequired;
        document.getElementById('avg-risk').innerText = Math.round(gRisk / inventory.length);

        // Rendu de la répartition
        const dist = document.getElementById('dist-container');
        Object.keys(counts).forEach(key => {
            if (counts[key] > 0) {
                dist.innerHTML += `<div class="dist-item" style="border: 1px solid var(--border-gray)">
                    <div style="font-weight:bold; color:#fff">${counts[key]}</div>
                    <div style="font-size:0.6rem; color:#8b949e">${key.replace(/_/g,' ')}</div>
                </div>`;
            }
        });
    }

    function applyFilter() {
        const val = document.getElementById('ecuFilter').value;
        document.querySelectorAll('.summary-row, .ecu-section').forEach(el => {
            if (val === "ALL" || el.getAttribute('data-ecu') === val) el.classList.remove('hidden');
            else el.classList.add('hidden');
        });
    }

    window.onload = init;
</script>
</body>
</html>
